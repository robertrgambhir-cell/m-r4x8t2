/* Warmup signature course (Nov 18, 2026): five five-minute lessons for paid canvassers who gather ballot initiative signatures.
   Source: ai/sig/sig.html, built by ai/tools/build-sig.mjs with the words in ai/sig/content.js and the graders in ai/sig/grade.js.
   The look is Warmup's one frame, the door-knocking lessons' (Robert's pick, Nov 20, 11:53 AM; playbook rules 58 and 62a): cream
   screens, Newsreader headlines, the campaign's name on top, dark buttons and the Tap to talk button. The world stays the course's
   own: the sidewalk, its people and the walking passersby. */
:root {
  --ink: #262320; --ink-2: #5B554D; --muted: #6F685F; --paper: #FCF8F2; --card: #FFFDF9; --soft: #F4EEE5; --line: #E3DBCF; --track: #E6DFD3; --bg: var(--paper);
  --green: #35B57C; --green-d: #1B7A4D; --green-soft: #DDF0E4; --drive: #5A3E99; --drive-soft: #EFEAF8;
  --head: "Newsreader", Georgia, serif;
  --red: #C2412D; --red-soft: #FBE8E4; --warm: #E08A1A; --warm-soft: #FDF1DC; --pen: #1F3F8F;
  --u0: 1px; --u: var(--u0); color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Figtree", system-ui, -apple-system, sans-serif; }
body { overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 10px) 20px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.top { flex: none; display: block; }
.top .row { display: flex; align-items: center; gap: 4px; height: 46px; margin-top: 4px; }
.top .row .sp { flex: 1; }
.top .drive { margin: 0; } .top .drive b { font-size: 24px; line-height: .92; } .top .drive small { font-size: 8px; letter-spacing: .04em; margin-top: 4px; } /* the door-knocking lessons' campaign name, at their size */
.x, .pp { flex: none; width: 34px; height: 34px; border: 0; background: none; padding: 0; display: grid; place-items: center; color: var(--ink); cursor: pointer; }
.x { margin-left: -9px; } span.x { cursor: default; } /* a result screen has no way back; the bar keeps its place */
.x svg { width: 24px; height: 24px; } .pp svg { width: 20px; height: 20px; }
/* the four steps, by name (Robert, Nov 20, 8:23 AM; playbook rule 56): one segment each, filling as its screens are done, and the
   one you're in named in green. The names may run a little past their segment, as the door-knocking lessons' do. */
.bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 6px 0 0; }
.bar button { min-width: 0; border: 0; background: none; padding: 0 0 2px; cursor: pointer; display: block; text-align: center; }
.bar button[disabled] { cursor: default; }
.bar button i { display: block; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar button i b { display: block; height: 100%; border-radius: inherit; background: var(--green); transition: width .4s ease; }
.bar button span { display: block; margin: 5px -4px 0; font: 700 10.5px/1.2 "Figtree"; letter-spacing: 0; white-space: nowrap; color: var(--muted); } /* as the door-knocking lessons' names */
.bar button.cur span { color: var(--green-d); } /* the step you're in: its name in green and a little green in its segment, as the door-knocking lessons mark it */
#scr { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; container-type: inline-size; --u: calc(var(--u0) * var(--k, 1)); }
/* fill: a screen with room to spare grows its words and pictures together (--k, set by fillUp in the engine) until the room is
   used, so no blank band is left. The main button keeps its size, so its words stay on one line. */
#scr > #ft, #scr > .foot, #scr > .link { --u: var(--u0); }
/* while fillUp measures, the blocks sit packed at the sizes they would like: nothing stretched, nothing squeezed */
#scr.fitting > .fill, #scr.fitting > .opts.decls { flex: 0 0 auto; justify-content: flex-start; }
#scr.fitting > *, #scr.fitting > .fill > * { flex-shrink: 0; }
#scr.fitting .faces.big { flex: 0 0 auto; height: calc(2 * min(132 * var(--u), 50cqw - 30px) + 60px); }
.tag { position: absolute; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 2px); font: 600 9px/1 "Figtree"; color: #A69E92; letter-spacing: 0.04em; pointer-events: none; z-index: 30; }
.tag.onpic { background: rgba(255,255,255,.82); color: #6F685F; border-radius: 4px; padding: 2px 4px; }
.kick { flex: none; margin: 10px 0 0; font: 700 calc(12.5 * var(--u))/1 "Figtree"; letter-spacing: .08em; text-transform: uppercase; color: var(--green-d); }
h1 { flex: none; font: 500 calc(22.4 * var(--u))/1.15 var(--head); letter-spacing: -0.01em; margin: 8px 0 0; text-wrap: balance; } /* the door-knocking lessons' headline (.h2) */
h1.lg { font-size: calc(30 * var(--u)); line-height: 1.08; letter-spacing: -0.015em; } /* and their title (.h1) */
.sub { flex: none; font: 500 calc(16 * var(--u))/1.4 "Figtree"; color: var(--muted); margin: 8px 0 0; text-wrap: pretty; }
.grow { flex: 1; min-height: 0; }
.fill { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; padding-top: 12px; }
.fill > :first-child { margin-top: 0; }
.fill > #why:empty { display: none; } /* an answer that isn't on screen yet takes no room */
.fill > .panel.short { flex: 1 1 calc(190 * var(--u)); height: auto; min-height: 84px; } /* and it takes any room the card has left over, so the words keep their size */ /* the small picture gives way first when a card is full */
/* the picture */
.panel { flex: 1; min-height: 0; margin-top: 12px; background: var(--soft); border-radius: 20px; overflow: hidden; position: relative; }
.panel.short { flex: 0 0 auto; height: 30%; min-height: 150px; }
.panel > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.panel > svg.fitw { height: auto; bottom: auto; } /* a wide picture always shows its full width; a short panel crops it from the bottom */
/* the painted pictures (playbook rule 67): each fills its frame, shifted by place() so faces sit where the screen needs them */
.ph { position: absolute; inset: 0; overflow: hidden; background: #E9E1D2; }
.ph .fr { position: absolute; left: var(--ox, 0px); top: var(--oy, 0px); width: var(--rw, 100%); height: var(--rh, 100%); } /* place() sizes and moves the picture */
.ph .fr { opacity: 0; transition: opacity .25s ease; } .ph .fr.ok { opacity: 1; }
.ph .fr > .bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ph .pt { position: absolute; transition: transform 1.5s cubic-bezier(.2,.65,.25,1), opacity .5s ease; transform-origin: 50% 100%; }
.ph .pt .bob { position: absolute; inset: 0; }
.ph .pt img { position: absolute; display: block; }
.ph .pt .cut { inset: 0; width: 100%; height: 100%; }
.ph .pt .alt { opacity: 0; transition: opacity .3s ease; } .ph .pt .alt.on { opacity: 1; } .ph .pt.alton .cut:not(.alt) { opacity: 0; transition: opacity .3s ease; }
.ph .pt .mo, .ph .pt .bl { opacity: 0; } .ph .pt .bl.on { opacity: 1; } /* the talking mouth and the closed eyes, shown by the page as the voice plays and now and then */
/* a passerby walks in over the storefront while the line plays (rule 54a): from your left toward the door, or from the right toward the canvasser */
.ph.one.off .pt.walker { transform: translateX(-55%) scale(.9); opacity: 0; } .ph.two.off .pt.walker { transform: translateX(42%) scale(.95); opacity: 0; }
.ph.one.gone .pt.walker { transform: translateX(58%) scale(.92); opacity: 0; } .ph.two.gone .pt.walker { transform: translateX(46%) scale(.95); opacity: 0; }
.ph.walking .pt.walker { transition: opacity .5s ease; will-change: transform; } .ph.walking.gone .pt.walker { opacity: 1; } /* lesson 2: the engine walks them across, and off */
.ph.walk .pt.walker .bob { animation: walkph .56s ease-in-out infinite; } @keyframes walkph { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.1%); } }
.ph.close img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; }
@media (prefers-reduced-motion: reduce) { .ph.walk .pt.walker .bob { animation: none; } .ph .pt { transition: opacity .5s ease; } }
/* a cover and the beat before a try have few words, so on a tall phone their picture would show a band of empty pavement.
   There the panel stops growing at the picture's own height (--cap, with a little ground under the shoes), and the room that
   is left goes to the words (fillUp). The storefront with nobody in it first draws up to a quarter larger, cropped at its
   sides, so it fills a tall panel */
.panel.cap:has(> .ph.two), .panel.cap:has(> .ph.shop), .panel.cap:has(> .ph.one) { --cap: 148cqw; max-height: var(--cap); margin-bottom: auto; } /* the pictures are 896 by 1216 and 768 by 1344: at the cap, a little of each side is cropped and no pavement band shows */
#scr.fitting > .panel.cap { flex: 0 0 auto; height: var(--cap); margin-bottom: 0; }
.panel.cap ~ .foot { margin-top: auto; padding-top: 12px; } /* any room still left sits half under the picture and half over the button */
#scr.fitting > .panel.cap ~ .foot { margin-top: 0; }
.who { position: absolute; left: 10px; top: 10px; background: rgba(255,255,255,.92); border-radius: 99px; padding: 6px 11px; font: 700 calc(13 * var(--u))/1 "Figtree"; z-index: 2; }
.who.r { left: auto; right: 10px; }
.nextp { flex: none; display: flex; align-items: center; gap: 10px; margin-top: 10px; font: 700 calc(15 * var(--u))/1.2 "Figtree"; }
.nextp svg, .nextp img.av { flex: none; object-fit: cover; width: calc(40 * var(--u)); height: calc(40 * var(--u)); border-radius: 50%; background: var(--soft); }
.capts { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 3; pointer-events: none; }
.capt { max-width: 92%; padding: 9px 13px; border-radius: 16px; font: 500 calc(15 * var(--u))/1.36 "Figtree"; animation: in .22s ease both; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
.capt b { font: 700 calc(15 * var(--u))/1.36 "Figtree"; display: inline; color: var(--ink); } .capt b::after { content: ": "; } /* "Coach: ...", as the door-knocking lessons' "Sofia: ..." */
.capt.them { align-self: flex-start; background: var(--card); border-bottom-left-radius: 5px; }
.capt.you { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 5px; }
.capt.you b { color: #FFFFFF; }
.capt.you.live { background: #4A453F; }
.capt.note { align-self: center; background: rgba(255,253,249,.95); color: var(--ink-2); font: 600 calc(13.5 * var(--u))/1.3 "Figtree"; text-align: center; }
.capt.note b { font: 700 calc(13.5 * var(--u))/1.3 "Figtree"; } .capt.note b::after { content: ": "; } /* a note with a speaker says who ("Coach: Tell her why."); a note without one has no label */
.coach { flex: none; margin: 10px 2px 0; font: 400 calc(16 * var(--u))/1.4 "Figtree"; color: var(--ink-2); text-wrap: pretty; min-height: calc(2 * 1.4 * 16 * var(--u)); }
.coach.q3 { min-height: calc(3 * 1.4 * 16 * var(--u)); }
.coach.dim { opacity: .4; }
/* the coach in writing (rule 68a; ?coach=voice brings back the talking coach, only to compare): its words look as they do on a ready screen, and the only other change is that a caption from the
   coach is a note, not a speech bubble, since nobody is talking. Over a tap question the coach's line comes first. The 1st try's ready
   screen frames the view from above on the walker, who starts near its top. */
.coachw { flex: none; margin: 8px 2px 2px; font: 400 calc(16 * var(--u))/1.4 "Figtree"; color: var(--ink-2); text-wrap: pretty; }
html.textc .capt.cw { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; box-shadow: none; }
.panel.walktop .ph.air img { object-position: 50% 5%; }
.hint { flex: none; margin: 10px 2px 0; font: 700 calc(15 * var(--u))/1.35 "Figtree"; color: var(--ink); }
/* a conversation is a FaceTime call: the person fills a card, as the door-knocking lessons' door does, the latest line from each
   side sits over the chest, never the face, and the talk button sits under the card */
.ft { flex: 1; min-height: 0; position: relative; margin: 10px 0 0; border-radius: 24px; overflow: hidden; background: var(--soft); box-shadow: 0 0 0 1px var(--line); }
.ft > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ft .who { left: 12px; top: 12px; }
.dock { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
.dock .capts { position: static; }
.dock .pet { margin: 0; box-shadow: inset 0 0 0 1.5px #D9D2C4, 0 2px 10px rgba(38,35,32,.14); }
.dock .pet .pet-t > span { letter-spacing: .025em; } /* the card's line takes a little width: the measure's name keeps to one line */
.dock.haspet .capt:not(:last-child) { display: none; } /* with the petition on screen only the latest line stays, so it always sits under the chin */

/* people */
.p { transition: transform 1.2s cubic-bezier(.3,.7,.2,1), opacity .5s ease; }
@keyframes walk { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.p .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }
@keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(.1); } }
.p .brow { transform-box: fill-box; transform-origin: center; transition: transform .25s ease; }
.p.warm .brow { transform: translateY(-2px); } .p.surprised .brow { transform: translateY(-4px); }
.p.busy .brow-l { transform: rotate(7deg); } .p.busy .brow-r { transform: rotate(-7deg); }
.prop { transition: opacity .35s ease, transform .45s cubic-bezier(.2,.8,.2,1); } .prop.hid { opacity: 0; transform: translateY(14px); }
/* buttons */
.foot { flex: none; display: flex; gap: 10px; margin-top: 12px; align-items: stretch; }
.btn { flex: 1; min-height: 54px; border: 1.5px solid var(--ink); border-radius: 16px; background: var(--ink); color: var(--paper); font: 700 16.5px/1.2 "Figtree"; letter-spacing: .005em; box-shadow: none; cursor: pointer; padding: 12px 14px; white-space: nowrap; transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(1px); }

.link { flex: none; align-self: center; border: 0; background: none; color: var(--muted); font: 600 calc(14 * var(--u))/1.2 "Figtree"; text-decoration: underline; text-underline-offset: 3px; padding: 8px 6px 0; cursor: pointer; }
/* taps */
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.opts.row { flex-direction: row; } .opts.row .opt { flex: 1; justify-content: center; text-align: center; padding: calc(26 * var(--u)) 4px; font: 700 calc(18 * var(--u))/1.1 "Figtree"; white-space: nowrap; }
.opts.two { display: grid; grid-template-columns: 1fr 1fr; }
/* a guess between numbers: three big tiles that fill the screen */
.opts.tall { flex: 1; min-height: 0; }
.opts.tall .opt { flex: 1; min-height: 50px; justify-content: center; align-items: center; text-align: center; font: 600 clamp(calc(31 * var(--u)), 4.6vh, calc(46 * var(--u)))/1 "Newsreader", Georgia, serif; }
.opt { text-align: left; border: 0; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); padding: 13px 14px; font: 700 calc(16 * var(--u))/1.28 "Figtree"; cursor: pointer; transition: background .2s, box-shadow .2s, transform .08s; display: flex; gap: 10px; align-items: flex-start; }
.opt:active { transform: translateY(1px); }
.opt .lt { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font: 800 12px/1 "Figtree"; color: var(--muted); margin-top: -1px; }
.opt.qt { font: 600 calc(15.5 * var(--u))/1.32 "Figtree"; }
.opt.right { background: var(--green-soft); box-shadow: inset 0 0 0 2px var(--green); } .opt.right .lt { background: var(--green); color: #fff; }
.opt.wrong { background: var(--red-soft); box-shadow: inset 0 0 0 2px var(--red); }
.opt.faded { opacity: .5; }
.opt.picked { box-shadow: inset 0 0 0 2px #A69E92; } /* a guess that wasn't the number: kept plain, never marked wrong */
.opts.done .opt { pointer-events: none; }
.pics { display: grid; grid-template-columns: 1fr; grid-auto-rows: 1fr; gap: 10px; margin-top: 14px; flex: 1; min-height: 56cqw; } /* A over B, each as wide as the screen: the two pictures take the room that is left, and each scene is drawn as large as its tile allows */
.pic { border: 0; padding: 0; border-radius: 18px; background: #EFE7D8; box-shadow: inset 0 0 0 1.5px var(--line); position: relative; overflow: hidden; cursor: pointer; }
.pic svg { position: absolute; left: 0; right: 0; bottom: 0; top: 12%; width: 100%; height: 88%; display: block; } /* the scene sits under the awning, so no head is ever behind it */
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 45%; } /* a painting carries the store's own sign */
.pic:has(img)::before { display: none; }

.pic .lt { position: absolute; left: 8px; top: 8px; width: 26px; height: 26px; border-radius: 50%; background: #fff; display: grid; place-items: center; font: 800 13px/1 "Figtree"; z-index: 2; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.pic.right { box-shadow: none; } .pic.right .lt { background: var(--green); color: #fff; }
.pic.wrong { box-shadow: none; } .pic.wrong .lt { background: var(--red); color: #fff; } .pic.faded { opacity: .55; }

.pic.right::after { box-shadow: inset 0 0 0 4px var(--green); } .pic.wrong::after { box-shadow: inset 0 0 0 4px var(--red); }
.why { flex: none; margin-top: 12px; display: flex; gap: 10px; align-items: flex-start; font: 500 calc(15.5 * var(--u))/1.38 "Figtree"; animation: in .3s ease both; text-wrap: pretty; }
.why.plain { font: 600 calc(15.5 * var(--u))/1.38 "Figtree"; }

.why .dot.no { background: #B8B0A3; } .why .dot svg { width: 14px; height: 14px; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } }

.lbl { flex: none; margin: 12px 0 0; font: 800 calc(12 * var(--u))/1 "Figtree"; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* mic: the door-knocking lessons' talk button. Dark, with a green mic, "Tap to talk"; while it listens it turns green and says
   "I'm done", and your bubble on the picture says "Listening. Say it your way." until your words come in. A note (a mic that

/* the live talk card, as the door-knocking lessons have it: a big mic, gray while it starts and green once it listens, bars that move
   while your words come in, and the words. Over the bottom of the picture, where the captions go while it shows. */
.tlive { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 12px 14px 12px 12px; border-radius: 22px; background: var(--card); box-shadow: 0 0 0 1.5px var(--line), 0 6px 24px rgba(0,0,0,.18); animation: vpin .3s ease both; }
@keyframes vpin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#microw > .tlive { margin-bottom: 2px; box-shadow: 0 0 0 1.5px var(--line); }
.dock:has(> .tlive) > .capts { display: none; }
.tlive .tl-mic { position: relative; width: 64px; height: 64px; border-radius: 50%; background: #A69E92; color: #FFFDF9; display: grid; place-items: center; transition: background .3s; }
.tlive.live .tl-mic { background: var(--green); }
.tlive .tl-mic svg { width: 28px; height: 28px; }
.tlive .tl-pulse { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--green); opacity: 0; pointer-events: none; }
.tlive.live .tl-pulse { animation: tlpulse 1.6s ease-out infinite; } .tlive.live .tl-pulse.p2 { animation-delay: .8s; }
@keyframes tlpulse { from { transform: scale(1); opacity: .9; } to { transform: scale(1.75); opacity: 0; } }
.tlive.go .tl-mic { animation: tlgo .5s cubic-bezier(.34,1.4,.4,1) both; } @keyframes tlgo { 0% { transform: scale(.85); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.tlive .tl-wave { display: flex; align-items: center; gap: 4px; height: 26px; }
.tlive .tl-wave i { display: block; width: 4px; height: 6px; border-radius: 2px; background: var(--green); opacity: .45; }
.tlive.talking .tl-wave i { opacity: 1; animation: tlwave .8s ease-in-out infinite; }
.tlive .tl-wave i:nth-child(3n+2) { animation-delay: .15s; } .tlive .tl-wave i:nth-child(3n) { animation-delay: .3s; } .tlive .tl-wave i:nth-child(4n) { animation-delay: .45s; }
@keyframes tlwave { 0%, 100% { height: 6px; } 50% { height: 24px; } }
.tlive .tl-said { margin: 4px 0 0; font: 700 calc(16.5 * var(--u))/1.3 "Figtree"; color: var(--green-d); max-height: 6.5em; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.tlive .tl-said:empty::before { content: attr(data-live); }
.tlive.warm .tl-said:empty::before { content: attr(data-warm); color: var(--muted); }
.tlive.go .tl-said:empty::before { content: attr(data-go); }
@media (prefers-reduced-motion: reduce) { .tlive .tl-pulse, .tlive.talking .tl-wave i, .tlive.go .tl-mic { animation: none; } }
/* your turn to talk: the button's green mic rings, so it's plain what to tap */
.micb.pulse .md::before, .micb.pulse .md::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--green); animation: tlpulse 1.6s ease-out infinite; }
.micb.pulse .md::after { animation-delay: .8s; }
@media (prefers-reduced-motion: reduce) { .micb.pulse .md::before, .micb.pulse .md::after { animation: none; opacity: 0; } }
/* a second example inside a step: its own short card, not a Part N of 4 screen */
.excard { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; background: rgba(252,248,242,.9); animation: vpin .25s ease both; cursor: pointer; }
.excard > div { width: 100%; max-width: 330px; padding: 22px 20px; border-radius: 22px; background: var(--card); box-shadow: 0 0 0 1.5px var(--line), 0 10px 30px rgba(38,35,32,.14); text-align: center; }
.excard small { display: block; font: 700 13px/1.2 "Figtree"; color: var(--green-d); }
.excard b { display: block; margin-top: 6px; font: 500 28px/1.1 var(--head); color: var(--ink); }
.excard p { margin: 10px 0 0; font: 500 16px/1.4 "Figtree"; color: var(--ink-2); text-wrap: balance; }
/* the stop-rate guess: three choices in a row, and a row of 20 passersby that shows the answer */
.p20 { flex: 1 1 auto; min-height: 104px; display: grid; grid-template-columns: repeat(10, 1fr); align-content: center; gap: 10px 4px; margin-top: 14px; padding: 14px 10px; border-radius: 18px; background: var(--soft); }
.p20 i { display: grid; place-items: center; }
.p20 svg { width: 100%; max-width: 28px; height: auto; fill: #C9C1B4; transition: fill .3s ease; }
.p20.done i.stop svg { fill: var(--green); } .p20.done i.half svg { fill: #9ED9BB; } .p20.done i.walk svg { fill: #D8D1C5; }
.opts.row.pct .opt { padding: calc(18 * var(--u)) 4px; font: 600 calc(21 * var(--u))/1.05 var(--head); }
/* the feedback card's one short tip, under the part to fix */
.rows li.tipline { margin: -2px 0 2px 32px; padding: 9px 12px; border-radius: 12px; background: var(--soft); font: 500 calc(14.5 * var(--u))/1.36 "Figtree"; color: var(--ink); text-wrap: pretty; }
.rows li.tipline b { font-weight: 800; }
.tip b { font-weight: 800; }
/* the lesson end: one message, then Done for today */
.endline { flex: none; margin: 8px 0 0; font: 500 calc(17 * var(--u))/1.4 "Figtree"; color: var(--ink-2); text-wrap: balance; }
h1.lineh { font-size: calc(19 * var(--u)); }
.coachsub { flex: none; margin: 8px 0 0; font: 500 calc(15.5 * var(--u))/1.4 "Figtree"; color: var(--ink-2); text-wrap: pretty; }
