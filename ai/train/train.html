    onWords: function (t) {
      if (!live) live = bubble("you", t, "live"); else live.textContent = t;
      var th = $("#thread"); if (th) th.scrollTop = th.scrollHeight;
      if (d.req && d.specText !== t) { d.req.abort(); d.req = null; d.specText = ""; } /* they kept talking: throw the early answer away */
    },
    onSpec: function (t) { if (d.req) d.req.abort(); d.specText = t; d.req = startTurn(t); },
    onDone: function (t, info) {
      d.mic = null;
      b.className = "micb wait"; b.innerHTML = ICON.mic;
      if (!t) { if (live) live.remove(); $("#mict").innerHTML = "<b>I didn’t catch that.</b> Tap and try again."; b.className = "micb pulse"; return; }
      if (live) { live.classList.remove("live"); live.textContent = t; }
      d.endAt = performance.now() - (info ? info.quietMs : 0); /* when they actually stopped talking */
      d.turns.push({ who: "you", text: t });
      if (!d.req || d.specText !== t) { if (d.req) d.req.abort(); d.req = startTurn(t); }
      d.busy = true;
      $("#mict").innerHTML = "<b>" + esc(D.voter.name) + " is answering.</b>";
      var ty = document.createElement("div"); ty.className = "typing"; ty.innerHTML = "<i></i><i></i><i></i>"; $("#thread").appendChild(ty); $("#thread").scrollTop = 1e6;
      d.req.play();
    },
    onError: function (c) { d.mic = null; if (live) live.remove(); b.className = "micb pulse"; b.innerHTML = ICON.mic; $("#mict").innerHTML = micErr(c); },
  });
}
function startTurn(text) {
  var d = S.door, turns = d.turns.concat(d.turns[d.turns.length - 1].who === "you" && d.turns[d.turns.length - 1].text === text ? [] : [{ who: "you", text: text }]);
  var bubbles = {}, sentAt = performance.now(), first = true;
  var h = {
    onSay: function () {},
    onStart: function (i, t) {
      var ty = document.querySelector("#thread .typing"); if (ty) ty.remove();
      if (first) { first = false; var gap = Math.round(performance.now() - (d.endAt || sentAt)); d.lat.push(gap); latShow(gap, req.tl, Math.round(performance.now() - sentAt)); }
      var el = bubbles.el; if (!el) el = bubbles.el = bubble("them", ""); el.textContent = (el.textContent ? el.textContent + " " : "") + t; var th = $("#thread"); if (th) th.scrollTop = th.scrollHeight;
    },
    onDone: function (o) {
      d.req = null;
      d.turns.push({ who: "them", text: o.say, sig: o.sig });
      if (o.care) { var n = document.createElement("div"); n.className = "note"; n.innerHTML = "<b>Stepping out of practice for a second.</b> If you’re going through something hard, call or text <a href=\"tel:988\">988</a>, the Suicide and Crisis Lifeline, any time."; $("#thread").appendChild(n); }
      if (o.end) { d.ended = true; setTimeout(endDoor, 700); return; }
      yourTurn();
    },
    onError: function (code) {
      if (code === "abort") return;
      if (!req.played) { if (d.req === req) d.req = null; d.specText = ""; return; } /* an early answer nobody heard yet: the real one goes when they stop */
      d.req = null; d.busy = false;
      var ty = document.querySelector("#thread .typing"); if (ty) ty.remove();
      d.turns = d.turns.filter(function (x, k) { return !(k === d.turns.length - 1 && x.who === "you"); }); /* the line goes again with Try again */
      var n = document.createElement("div"); n.className = "note"; n.innerHTML = esc(D.voter.name) + " didn’t answer" + (code === "rate" || code === "budget" ? " (the practice AI is busy)" : "") + '. <button class="link" id="retry">Try again</button>';
      $("#thread").appendChild(n); $("#thread").scrollTop = 1e6;
      $("#retry").onclick = function () { n.remove(); d.turns.push({ who: "you", text: text }); d.busy = true; var ty2 = document.createElement("div"); ty2.className = "typing"; ty2.innerHTML = "<i></i><i></i><i></i>"; $("#thread").appendChild(ty2); d.endAt = performance.now(); d.req = startTurn(text); d.req.play(); };
      var b = $("#mic"); if (b) { b.className = "micb pulse"; b.innerHTML = ICON.mic; } $("#mict").innerHTML = "<b>Tap Try again</b>, or answer again.";
    },
  };
  var req = turnStream(turns, h);
  return req;
}
function latShow(gap, tl, sent) { if (!LAT) return; var el = $("#lat"); if (el) el.textContent = "stopped talking to voice " + gap + " ms\nsent to first text " + Math.round(tl.firstText) + " ms, first audio " + Math.round(tl.firstAudio) + " ms\nall: " + S.door.lat.join(", "); try { console.log("[warmup latency]", gap, JSON.stringify(tl)); } catch (e) {} }
function mouth() {
  var tick = function () {
    var m = document.querySelector("#door .mouth"); if (!m) return;
    var lv = Math.min(1, level() * 9); m.style.transform = "scaleY(" + (0.25 + lv * 1.6).toFixed(2) + ")";
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function endDoor() {
  var d = S.door; if (!d) return;
  if (d.mic) { d.mic.abort(); d.mic = null; }
  if (d.req) { d.req.abort(); d.req = null; }
  d.ended = true;
  var you = d.turns.filter(function (t) { return t.who === "you"; });
  S.coach = you.length ? postJSON("/coach", { scenario: D.scen, turns: d.turns }, 35000).catch(function (e) { return { error: (e && e.code) || "network" }; }) : Promise.resolve(null);
  var wait = playing.length ? 400 : 0;
  setTimeout(function () { if (FLOW[S.at].kind === "door") go(S.at + 1); }, wait + 300);
}

/* how it went: the coach's read of what they actually said */
function vCoach() {
  top({ practice: "coach" }); tag("How it went");
  $("#scr").innerHTML = '<h1>How it went with ' + esc(D.voter.name) + '</h1><div class="pend" id="pend"><div><div class="typing" style="margin:0 auto 12px"><i></i><i></i><i></i></div>Reading your conversation</div></div>';
  (S.coach || Promise.resolve(null)).then(function (c) {
    if (FLOW[S.at].kind !== "coach") return;
    var you = S.door ? S.door.turns.filter(function (t) { return t.who === "you"; }) : [];
    if (!c || c.error || !c.items) {
      $("#scr").innerHTML = '<h1>How it went with ' + esc(D.voter.name) + '</h1><p class="sub">' + (you.length ? "The coach couldn’t read this one. Your conversation still counts." : "You ended before you said anything.") + '</p><div style="flex:1"></div>' + foot(btn("Talk to " + esc(D.voter.name) + " again", "again", "ghost") + btn("Finish the lesson", "fin"));
    } else {
      var card = c.items.filter(function (x) { return D.cards.indexOf(x.id) >= 0; });
      card.sort(function (a, b) { return D.cards.indexOf(a.id) - D.cards.indexOf(b.id); });
      var met = card.filter(function (x) { return x.status === "met"; }).length;
      var label = function (x) { var r = D.rubric[x.id] || {}; return x.status === "met" ? r.hit : x.status === "partial" ? r.label : r.miss; };
      var rows = card.map(function (x) {
        var cls = x.status === "met" ? "" : x.status === "partial" ? " part" : " no";
        var ev = x.evidence && x.id !== "accurate" ? '<span>“' + esc(x.evidence.replace(/^["“]+|["”]+$/g, "")) + '”</span>' : x.note ? '<span>' + esc(x.note) + '</span>' : "";
        return '<li><span class="ck' + cls + '">' + (x.status === "missed" ? ICON.no : ICON.ok) + '</span><div><b>' + esc(label(x)) + '</b>' + ev + '</div></li>';
      }).join("");
      var imp = c.improvement && c.improvement.try_saying ? '<div class="model" style="flex:none"><small>Next time, try</small>' + esc(c.improvement.try_saying) + '</div>' : "";
      $("#scr").innerHTML = '<h1>' + (met === card.length ? "You landed every point with " + esc(D.voter.name) : met >= card.length - 1 ? "Almost all of it landed with " + esc(D.voter.name) : "Here’s what landed with " + esc(D.voter.name)) + '</h1>' +
        '<ul class="rows">' + rows + '</ul>' + imp + foot(btn("Talk again", "again", "ghost") + btn("Finish the lesson", "fin"));
    }
    $("#again").onclick = function () { go(FLOW.findIndex(function (x) { return x.kind === "door"; })); };
    $("#fin").onclick = next;
  });
}

/* done: what they can now do, the one credit, the sources, and the next lesson */
function vDone() {
  top({}); tag("Done");
  if (!S.finishedAt) {
    S.finishedAt = performance.now();
    if (window.parent !== window) { try { window.parent.postMessage({ warmup: "brief-done", lesson: LID }, "*"); } catch (e) {} } /* the app checks it off on Learn */
  }
  var secs = S.t0 ? Math.round((S.finishedAt - S.t0) / 1000) : 0, mm = Math.floor(secs / 60), ss = String(secs % 60).padStart(2, "0");
  var other = DATA.lessons[D.nextId];
  $("#scr").innerHTML = '<div class="big"><svg class="seal" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="44" fill="#E6F5EC"/><circle cx="48" cy="48" r="32" fill="#35B57C"/><path d="M34 49 L44 59 L63 38" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
    '<h1 style="text-align:center">' + esc(D.doneH) + '</h1><p class="sub" style="text-align:center">' + esc(D.doneSub) + '</p>' + (secs ? '<p class="stat">Learned and practiced in ' + mm + ":" + ss + '</p>' : "") +
    '<p class="credit">' + D.credit + ' <button class="link" id="src" style="padding:2px 0">Sources</button></p></div>' +
    foot((other && !EMB ? btn("Next: " + esc(other.short), "nextL", "blue") : btn(EMB ? "Back to Learn" : "Back to Warmup", "back")));
  $("#src").onclick = sources;
  if ($("#nextL")) $("#nextL").onclick = function () { location.href = location.pathname + "?l=" + D.nextId + (LAT ? "&lat" : ""); };
  if ($("#back")) $("#back").onclick = close;
}
function sources() {
  var sh = document.createElement("div"); sh.className = "sheet";
  sh.innerHTML = '<div role="dialog" aria-label="Sources"><h2>Sources</h2><p class="sub" style="margin:0">' + esc(D.sourcesSub) + '</p>' +
    D.sources.map(function (g) { return '<h3>' + esc(g[0]) + '</h3><ol>' + g[1].map(function (s) { return '<li>' + esc(s[0]) + ': <a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[2]) + '</a></li>'; }).join("") + '</ol>'; }).join("") +
    '<p class="fine">The narrator and the voters are AI voices. Maya Kaur and the state of Woodbridge are a sample campaign. Nothing you say is stored.</p><div class="foot"><button class="btn ghost" id="shx" style="flex:1">Close</button></div></div>';
  document.body.appendChild(sh);
  sh.addEventListener("click", function (e) { if (e.target === sh || e.target.id === "shx") sh.remove(); });
}

/* the narration and the opening line load while the cover is read */
D.narration.forEach(function (_, n) { fetchClip(D.scen + "-" + n); }); fetchClip(D.scen + "-open");
if (qs.has("at")) { /* tests and review: open a screen by name */ var at = qs.get("at"), k = FLOW.findIndex(function (f) { return f.kind === at; }); if (k >= 0) { S.t0 = performance.now(); go(k); } else go(0); } else go(0);
window.__train = { S: S, go: go, FLOW: FLOW, D: D };
})();
</script>
