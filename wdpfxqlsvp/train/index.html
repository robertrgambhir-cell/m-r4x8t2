paign","https://www.foxnews.com/politics/brown-embraced-amazon-data-centers-blaming-higher-utility-costs-high-stakes-senate-race","“I’ll require the data centers to pay the full cost of their own electricity, not you.”"],["sherrodbrown.com","https://www.sherrodbrown.com/our-fight/","Fighting to require data centers to pay the full cost of their utilities and to cap rate hikes"]]],["Her opponent (Sen. Jon Husted)",[["Roll Call","https://rollcall.com/2026/09/30/voluntary-ratepayer-protection-bill-blocked-in-senate-again/","Husted introduced the Senate version of the voluntary bill and led efforts to pass it"]]]],"narration":["Here's Maya's fight on electric bills, in under a minute.","Start with the bill. In 2019, the average home here paid about eighty-nine dollars a month.","This January, about a hundred and forty-five. That's up more than half.","The biggest new reason? Data centers. Giant buildings full of computers that run the internet and AI, all day and all night.","The grid's independent watchdog found data centers drove forty-five percent of the costs in the grid's last three power auctions. And that lands on everyone's bill.","Maya's answer fits in one line. In her words: I'll require the data centers to pay the full cost of their own electricity, not you.","She's also fighting to cap how much utility companies can raise your rates.","Her opponent has a bill too. But it only asks each state to consider making data centers pay. No state has to. And it stalled in the Senate.","So at the door: their bill, the reason, then Maya's fix. Quick check, then you'll talk it through with a real voter."],"rubric":{"bill":{"label":"Start with her bill","hit":"Started with her bill","miss":"Didn't start with her bill"},"why":{"label":"Say why bills went up","hit":"Said why bills went up","miss":"Didn't say why bills went up"},"plan":{"label":"Maya's plan","hit":"Explained Maya's plan","miss":"Didn't explain Maya's plan"},"opp":{"label":"How her opponent's bill differs","h   $("#scr").innerHTML = '<div class="big"><svg class="seal" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="44" fill="#E6F5EC"/><circle cx="48" cy="48" r="32" fill="#35B57C"/><path d="M34 49 L44 59 L63 38" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
    '<h1 style="text-align:center">' + esc(D.doneH) + '</h1><p class="sub" style="text-align:center">' + esc(D.doneSub) + '</p>' + (secs ? '<p class="stat">Learned and practiced in ' + mm + ":" + ss + '</p>' : "") +
    '<p class="credit">' + D.credit + ' <button class="link" id="src" style="padding:2px 0">Sources</button></p></div>' +
    foot((other && !EMB ? btn("Next: " + esc(other.short), "nextL", "blue") : btn(EMB ? "Back to Learn" : "Back to Warmup", "back")));
  $("#src").onclick = sources;
  if ($("#nextL")) $("#nextL").onclick = function () { location.href = location.pathname + "?l=" + D.nextId + (LAT ? "&lat" : ""); };
  if ($("#back")) $("#back").onclick = close;
}
function sources() {
  var sh = document.createElement("div"); sh.className = "sheet";

  document.body.appendChild(sh);
  sh.addEventListener("click", function (e) { if (e.target === sh || e.target.id === "shx") sh.remove(); });
}

window.__train = { S: S, go: go, FLOW: FLOW, D: D };
