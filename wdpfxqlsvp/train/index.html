<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Warmup</title>
<style>
  html, body { margin: 0; height: 100%; background: #FCF8F2; }
  .box { height: 100%; display: grid; place-items: center; text-align: center; padding: 0 24px; font: 17px/1.5 -apple-system, system-ui, sans-serif; color: #262320; }
  a { color: #1F4C91; }
</style>
</head>
<body>
<!-- Version 173 (Nov 18, 2026): the issue lessons that lived at this address left the app. Maya Kaur's issue trainings are
     now Heating oil and Social Security, opened from the app's Learn tab. An old link lands there; an old copy of the app
     that still opens this page in its frame is told to close the frame. -->
<div class="box"><p>Maya Kaur&rsquo;s issue trainings have moved. <a id="go" href="../?issues">Open the issue trainings</a></p></div>
<script>
(function () {
  var framed = false;
  try { framed = window.parent !== window; } catch (e) { framed = true; }
  if (framed) { try { window.parent.postMessage({ warmup: "issues-close" }, "*"); } catch (e) { /* nothing to close */ } return; }
  var to = /[?&#](lesson|l)=me\b/.test(location.search + location.hash) ? "../?issues=oil" : "../?issues"; /* the old heating oil lesson's links open the new Heating oil training */
  document.getElementById("go").setAttribute("href", to);
  location.replace(to);
})();
</script>
</body>
</html>
