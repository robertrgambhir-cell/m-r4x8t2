<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Warmup">
<meta property="og:title" content="Tap this link to open your canvass warmup.">
<meta property="og:description" content="A welcome from Maya Kaur, then your first five-minute lesson.">
<meta property="og:url" content="https://robertrgambhir-cell.github.io/m-r4x8t2/wdpfxqlsvp/">
<meta name="description" content="A welcome from Maya Kaur, then your first five-minute lesson.">
<link rel="apple-touch-icon" href="https://robertrgambhir-cell.github.io/m-r4x8t2/apple-touch-icon2.png">
<link rel="icon" type="image/png" href="https://robertrgambhir-cell.github.io/m-r4x8t2/icon2.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Warmup</title>
<style>
  html, body { margin: 0; height: 100%; background: #FCF8F2; }
  .load { height: 100%; display: grid; place-items: center; }
  .load svg { animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .load svg { animation: none; } }
  .err { font: 16px/1.5 -apple-system, system-ui, sans-serif; color: #262320; text-align: center; padding: 24px; }
</style>
</head>
<body>
<!-- A small front page so iMessage can read the link preview; it loads the app (app.html) in place, keeping this address. -->
<div class="load" id="load"><svg width="56" height="56" viewBox="0 0 84 84" aria-label="Loading"><circle cx="42" cy="42" r="32" fill="none" stroke="#E6DFD3" stroke-width="12"/><circle cx="42" cy="42" r="32" fill="none" stroke="#35B57C" stroke-width="12" stroke-linecap="round" stroke-dasharray="151 202" transform="rotate(-90 42 42)"/></svg></div>
<script>
fetch("app.html" + location.search, { cache: "no-cache" })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function (html) { document.open(); document.write(html); document.close(); })
  .catch(function () { document.getElementById("load").innerHTML = '<p class="err">Warmup didn&#39;t load. Check your connection and reload the page.</p>'; });
</script>
</body>
</html>
