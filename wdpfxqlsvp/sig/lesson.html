/* Warmup signature course (Nov 18, 2026): five five-minute lessons for paid canvassers who gather ballot initiative signatures.
   Source: ai/sig/sig.html, built by ai/tools/build-sig.mjs with the words in ai/sig/content.js and the graders in ai/sig/grade.js.
   The look is the trainings' look (claude/training-playbook.md, part A): Figtree, Newsreader for spoken words, white screens. */
:root {

  --u0: 1px; --u: var(--u0); color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Figtree", system-ui, -apple-system, sans-serif; }
body { overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 10px) 18px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.top { flex: none; display: flex; align-items: center; gap: 10px; height: 34px; }
.x, .pp { flex: none; width: 34px; height: 34px; border: 0; background: none; padding: 0; display: grid; place-items: center; color: #7A7268; cursor: pointer; }
.x { margin-left: -8px; } span.x { cursor: default; } /* a result screen has no way back; the bar keeps its place */

.bar { flex: 1; display: flex; gap: 4px; }
.bar button { flex: 1; height: 26px; border: 0; background: none; padding: 0; cursor: pointer; position: relative; }
.bar button[disabled] { cursor: default; }
.bar button::after { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 6px; border-radius: 3px; background: var(--line); }
.bar button.full::after { background: var(--green); }
.bar button.cur::after { box-shadow: 0 0 0 2px var(--ink); } /* where you are: an outline, never a partly filled bar */
#scr { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; container-type: inline-size; --u: calc(var(--u0) * var(--k, 1)); }
/* fill: a screen with room to spare grows its words and pictures together (--k, set by fillUp in the engine) until the room is
   used, so no blank band is left. The main button keeps its size, so its words stay on one line. */
#scr > #ft, #scr > .foot, #scr > .link { --u: var(--u0); }
/* while fillUp measures, the blocks sit packed at the sizes they would like: nothing stretched, nothing squeezed */

#scr.fitting > *, #scr.fitting > .fill > * { flex-shrink: 0; }
#scr.fitting .faces.big { flex: 0 0 auto; height: calc(2 * min(132 * var(--u), 50cqw - 30px) + 60px); }
.tag { position: absolute; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 2px); font: 600 9px/1 "Figtree"; color: #A69E92; letter-spacing: 0.04em; pointer-events: none; z-index: 30; }
.tag.onpic { background: rgba(255,255,255,.82); color: #6F685F; border-radius: 4px; padding: 2px 4px; }
.kick { flex: none; margin: 10px 0 0; font: 800 calc(12 * var(--u))/1 "Figtree"; letter-spacing: .07em; text-transform: uppercase; color: var(--green-d); }
h1 { flex: none; font: 800 calc(23 * var(--u))/1.18 "Figtree"; letter-spacing: -0.015em; margin: 8px 0 0; text-wrap: balance; }
h1.lg { font-size: calc(30 * var(--u)); line-height: 1.12; }
.sub { flex: none; font: 500 calc(16 * var(--u))/1.4 "Figtree"; color: var(--muted); margin: 8px 0 0; text-wrap: pretty; }
.grow { flex: 1; min-height: 0; }
.fill { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; padding-top: 12px; }
.fill > :first-child { margin-top: 0; }
.fill > #why:empty { display: none; } /* an answer that isn't on screen yet takes no room */
.fill > .panel.short { flex: 1 1 calc(190 * var(--u)); height: auto; min-height: 84px; } /* and it takes any room the card has left over, so the words keep their size */ /* the small picture gives way first when a card is full */
/* the picture */
.panel { flex: 1; min-height: 0; margin-top: 12px; background: var(--soft); border-radius: 20px; overflow: hidden; position: relative; }
.panel.short { flex: 0 0 auto; height: 30%; min-height: 150px; }
.panel > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.panel > svg.fitw { height: auto; bottom: auto; } /* a wide picture always shows its full width; a short panel crops it from the bottom */
/* the painted pictures (playbook rule 67): each fills its frame, shifted by place() so faces sit where the screen needs them */
.ph { position: absolute; inset: 0; overflow: hidden; background: #E9E1D2; }
.ph .fr { position: absolute; left: var(--ox, 0px); top: var(--oy, 0px); width: var(--rw, 100%); height: var(--rh, 100%); } /* place() sizes and moves the picture */
.ph .fr { opacity: 0; transition: opacity .25s ease; } .ph .fr.ok { opacity: 1; }
.ph .fr > .bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ph .pt { position: absolute; transition: transform 1.5s cubic-bezier(.2,.65,.25,1), opacity .5s ease; transform-origin: 50% 100%; }
.ph .pt .bob { position: absolute; inset: 0; }
.ph .pt img { position: absolute; display: block; }
.ph .pt .cut { inset: 0; width: 100%; height: 100%; }
.ph .pt .alt { opacity: 0; transition: opacity .3s ease; } .ph .pt .alt.on { opacity: 1; } .ph .pt.alton .cut:not(.alt) { opacity: 0; transition: opacity .3s ease; }
.ph .pt .mo, .ph .pt .bl { opacity: 0; } .ph .pt .bl.on { opacity: 1; } /* the talking mouth and the closed eyes, shown by the page as the voice plays and now and then */

.ph.one.off .pt.walker { transform: translateX(-55%) scale(.9); opacity: 0; } .ph.two.off .pt.walker { transform: translateX(42%) scale(.95); opacity: 0; }

.ph.walk .pt.walker .bob { animation: walkph .56s ease-in-out infinite; } @keyframes walkph { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.1%); } }
.ph.close img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; }
@media (prefers-reduced-motion: reduce) { .ph.walk .pt.walker .bob { animation: none; } .ph .pt { transition: opacity .5s ease; } }
/* a cover and the beat before a try have few words, so on a tall phone their picture would show a band of empty pavement.

   is left goes to the words (fillUp). The storefront with nobody in it first draws up to a quarter larger, cropped at its
   sides, so it fills a tall panel */

#scr.fitting > .panel.cap { flex: 0 0 auto; height: var(--cap); margin-bottom: 0; }
.panel.cap ~ .foot { margin-top: auto; padding-top: 12px; } /* any room still left sits half under the picture and half over the button */
#scr.fitting > .panel.cap ~ .foot { margin-top: 0; }

.who.r { left: auto; right: 10px; }

/* a conversation is a FaceTime call: the person fills the screen edge to edge, the mic floats over the picture and the

.ft { flex: 1; min-height: 0; position: relative; margin: 10px -18px calc(-16px - env(safe-area-inset-bottom, 0px)); border-radius: 22px 22px 0 0; overflow: hidden; background: var(--soft); }
.ft > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.dock { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-direction: column; gap: 8px; z-index: 3; }

.dock.haspet .capt:not(:last-child) { display: none; } /* with the petition on screen only the latest line stays, so it always sits under the chin */

.opt { text-align: left; border: 0; border-radius: 16px; background: #fff; box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 var(--line); padding: 13px 14px; font: 700 calc(16 * var(--u))/1.28 "Figtree"; cursor: pointer; transition: background .2s, box-shadow .2s, transform .08s; display: flex; gap: 10px; align-items: flex-start; }
.opt:active { transform: translateY(2px); }

.opt.qt { font: 500 calc(16.5 * var(--u))/1.3 "Newsreader", Georgia, serif; }

.pics { display: grid; grid-template-columns: 1fr; grid-auto-rows: 1fr; gap: 10px; margin-top: 14px; flex: 1; min-height: 56cqw; } /* A over B, each as wide as the screen: the two pictures take the room that is left, and each scene is drawn as large as its tile allows */
.pic { border: 0; padding: 0; border-radius: 18px; background: #EFE7D8; box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 var(--line); position: relative; overflow: hidden; cursor: pointer; }
.pic svg { position: absolute; left: 0; right: 0; bottom: 0; top: 12%; width: 100%; height: 88%; display: block; } /* the scene sits under the awning, so no head is ever behind it */
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 45%; } /* a painting carries the store's own sign */
.pic:has(img)::before { display: none; }

":"Now listen to Lena. She does this all day.","clip":"3a0c94914800","dur":2.4},"scenes":[{"who":"tanya","note":"Stage note, art only: Lena stands in front of her table, board in hand. Tanya Brooks, 45, pushes a shopping cart with her daughter riding in it.","lines":[{"who":"lena","text":"Hi there! This petition is for longer library hours. Are you registered to vote in LA County?","clip":"48015756e5f2","dur":6.17},{"who":"tanya","text":"I am, yeah.","act":"slow","clip":"0a35b1f9a4cc","dur":1.08}],"ticks":[{"who":"coach","text":"First, she said hi.","clip":"49037e875ada","dur":1.49},{"who":"coach","text":"Second, she said what the petition is for in one short sentence.","clip":"3c4fc6067033","dur":3.72},{"who":"coach","text":"Third, she asked if the woman is registered to vote in LA County. A yes means the woman can sign, and now they're talking.","clip":"0dd30c708446","dur":8.47},{"who":"coach","text":"Fourth, she never asked for a minute. The whole thing took about five seconds.","clip":"9f02d43beafb","dur":4.66}]},{"who":"dwayne","note":"Stage note, art only: Dwayne Carter, 58, walks up.","lines":[{"who":"lena","text":"Hi there! This petition is for longer library hours. Are you registered to vote in LA County?","clip":"48015756e5f2","dur":6.17},{"who":"dwayne","text":"Nope. Never got around to it.","clip":"22764a1662e2","dur":1.92},{"who":"lena","text":"No problem. Have a good one!","act":"go","clip":"0d3eabf555ba","dur":1.63}],"after":{"who":"coach","text":"That man can't sign, so Lena lets him go and turns to the next person. His 'no' just saved her a minute.","clip":"c5a359557b89","dur":7.2}}]},{"kind":"taps","name":"Where to stand","secs":31,"coach":{"who":"coach","text":"Words are half the job. The other half is where you stand.","clip":"db26b8b77e1e","dur":3.67},"qs":[{"ask":"Which canvasser gets more people to stop?","pics":["sit","stand"],"alt":["A canvasser sitting behind the table, looking down at a phone.","A canvasser standing in front of the table,  note, art only: Luis Ortega, 29, in a kitchen apron, heading to work.","up":"Next up: a man in a kitchen apron.","upBtn":"Next: the man in the apron","replies":{"stop":{"who":"luis","text":"Yeah, I'm registered.","act":"slow","clip":"c339d2f4f71c","dur":1.44},"lib":{"who":"luis","text":"Oh, the library? What do you need?","act":"slow","clip":"d23a1b217d04","dur":2.09},"other":{"who":"luis","text":"Sorry, what's this for?","act":"turn","clip":"a412f9ea4f80","dur":1.37},"fHi":{"who":"luis","text":"Hi.","clip":"8e6ebe03721a","dur":0.53},"fSmall":{"who":"luis","text":"I'm good, thanks.","clip":"0c5e4b6e1df1","dur":1.22},"fPush":{"who":"luis","text":"I'd rather decide for myself.","clip":"b870284b63bc","dur":1.73},"fBye":{"who":"luis","text":"Okay, bye now.","act":"go","clip":"a4e339d28b07","dur":1.25}}}]},{"kind":"end","name":"Feedback and lesson done","secs":31}],"sources":[["Five or six stops per hundred",[["KPBS, 2016","https://www.kpbs.org/news/2016/may/11/california-elections-are-bonanza-signature-gathere/"]],"one strategist's estimate"],["A spoken ask raises givers and a third of shoppers avoid it",[["Andreoni, Rao and Trachtman","https://econweb.ucsd.edu/~jandreon/WorkingPapers/AndreoniRaoTrachtman.pdf"]],"a charity study used here as an analogy"],["Direct requests, eye contact, smiling and a small first request",[["Hadi and colleagues, Voluntas, 2026","https://www.cambridge.org/core/journals/voluntas/article/state-of-the-art-and-future-research-directions-in-facetoface-fundraising-a-systematic-literature-review/F15A95B216CC7CD05E92E7C29A1F72CD"]],"a review of charity fundraising studies"],["Hourly benchmarks",[["Change Laws Now post","https://www.career.com/job/change-laws-now/petition-circulator/j202604120919356252670"],["Wilson v. The La Jolla Group","https://law.justia.com/cases/california/court-of-appeal/2021/d077134.html"],["NJ Libertarian Party","https://njlp.org/news-top/35-candidates/169-petitioning"],["Clean the Darn Air","https://www.cleanthedarnair.o es and how it's paid for","step":"Telling both halves","must":"Telling both halves is a must. Try it once more.","done":"Said what it does and how it's paid for.","missed":"Left out how it's paid for.","missedAlt":"Left out what it does.","missedUntrue":"Said something the measure doesn't say.","tip":"Tell both halves every time: what the measure does and how it's paid for.","mustSay":{"who":"coach","text":"Telling both halves is a must. Try it once more.","clip":"a4b8fd8176af","dur":3.22}},{"name":"Asks if they've signed this one already","done":"Asked if she signed this one already.","missed":"Didn't ask about a double.","tip":"Ask 'Have you signed this one already?' before the pen moves."},{"name":"Asks for the signature and leaves the choice with them","done":"Asked for the signature.","missed":"Didn't ask for the signature.","missedVague":"Pushed her to sign.","tip":"End by asking: 'Will you sign to put it on the ballot?' Hold out the pen. People sign when they're asked."}],"tipAll":"You said you're paid, told both halves, checked for a double and asked clearly. That's a signature you can stand behind.","headsUp":"Heads up: say you're paid and show the top funders before the petition leaves your hand.","nextShift":"On your next shift: say you're paid and show the top funders before the petition leaves your hand, every time.","steps":[{"kind":"try1","name":"Your 1st try","secs":33,"coach":{"who":"coach","text":"A woman with a shopping cart heard your opener and stopped. When you're ready, ask for her signature.","clip":"d1f078a31265","dur":5.93},"who":"tanya","pic":"tanya-cart","note":"Stage note, art only: Tanya Brooks, 45, her daughter in the cart, has stopped at the table.","opens":{"who":"tanya","text":"Yeah, I'm registered. What's this about?","clip":"38fa64342eb2","dur":2.69},"replies":{"yes":{"who":"tanya","text":"Okay, sure.","act":"pen","clip":"d3d10b9bddfb","dur":1.13},"wait":{"who":"tanya","text":"So, do you need something from me?","clip":"d9341c9e23f8","dur":2.35},"nodbl":{"who":"tanya","text":"No, I haven't signed it.","clip":"ed6708ad2f03","dur":1.61},"fHi":{"who":"tanya","text":"Hi.","clip":"51940e4e5359","dur":0.6},"fSmall":{"who":"tanya","text":"I'm good, thanks.","clip":"13c107b02b93","dur":1.22},"fPush":{"who":"tanya","text":"I'd rather decide for myself.","clip":"7e698885b795","dur":1.9},"fBye":{"who":"tanya","text":"Okay, bye now.","act":"go","clip":"a36b830da430","dur":1.25}}},{"kind":"hear","name":"Hear it done","secs":57,"coach":{"who":"coach","text":"Now listen to Lena. An older man heard her opener and stopped.","clip":"5ac16d355358","dur":4.06},"sources":true,"scenes":[{"who":"bob","stopped":true,"note":"Stage note, art only: Bob Hall, 73, has stopped at the table.","lines":[{"who":"bob","text":"I'm registered. What've you got?","clip":"b1356db407c5","dur":2.21},{"who":"lena","text":"Thanks for stopping. I'm paid to gather signatures, and here are this month's top funders.","act":"sheet","clip":"ee450dd94e0d","dur":4.99},{"who":"lena","text":"It funds longer evening and weekend hours at branch libraries, and it's paid for by a new state tax on digital ad sales. Have you signed this one already?","clip":"246d0d47a8cf","dur":9.62},{"who":"bob","text":"No, first I've heard of it.","clip":"4403593beb8c","dur":1.46},{"who":"lena","text":"Then here's the petition. Will you sign to put it on the ballot?","act":"board","clip":"50235bdb22e1","dur":3.91},{"who":"bob","text":"All right.","act":"pen","clip":"37c517084f6a","dur":0.84}],"ticks":[{"who":"coach","text":"First, she said she's paid and showed the top funders before the petition left her hand. The law requires both, even if nobody asks.","clip":"4b8908581486","dur":9.1},{"who":"coach","text":"Second, she said what the measure does and how it's paid for.","clip":"a53fa3002e0a","dur":3.55},{"who":"coach","text":"Third, she asked if he signed already, because one double can cost about 1,000 signatures.","clip":"cbc54bb19ff7","dur":6.12},{"who":"coach","text":"Fourth, she asked for the signature and left the choice with him, because people sign when they're asked.","clip":"1fe768754586","dur":6.14}]}]},{"kind":"taps","name":"Three taps on honest wording","short":"honest wording","secs":64,"qs":[{"pic":{"who":"tanya"},"ask":"Which line about the measure can you say?","opts":["It keeps our libraries from closing.","It gives libraries more hours, and it won't cost you a thing.","It funds longer library hours with a new state tax on digital ad sales."],"quote":true,"right":2,"after":{"who":"coach","text":"C is right. Nothing in the measure says libraries are closing, and nobody can promise what a tax will cost.","clip":"f473b84db28e","dur":7.13}},{"pic":{"sheet":"October","day":["November","3"]},"ask":"Your top funders sheet says 'Valid only for October.' It's November 3. What do you do?","opts":["Use it anyway.","Get this month's sheet from your lead.","Skip the sheet today."],"right":1,"after":{"who":"coach","text":"B is right. A sheet is only good for the month printed on it.","clip":"75d33bb8bfa1","dur":3.86}},{"pic":{"who":"luis"},"ask":"A passerby thinks he signed this petition last week. What do you do?","opts":["Thank him and move on.","Have him sign again to be safe.","Have him sign, then tell your lead it might be a double."],"right":0,"sources":true,"after":{"who":"coach","text":"A is right. A second signature never helps, and it can cost the drive about 1,000.","clip":"b6b9f73bd477","dur":5.38}}]},{"kind":"spot","name":"Catch the mistake","secs":46,"coach":{"who":"coach","text":"Here's Rico again. One part is missing.","clip":"fdafeb49a13a","dur":2.57},"who":"soojin","by":"rico","stopped":true,"note":"Stage note, art only: Soo-jin Kim, 67, with a tote bag, has stopped.","lines":[{"who":"rico","text":"Here are this month's top funders. It funds longer evening and weekend hours at branch libraries, and it's paid for by a new state tax on digital ad sales. Have you signed this one already?","act":"sheet","c /* the feedback card (three blocks), then the lesson end */
VIEW.end = function (st) {
  if (S.sub === 0 && LN !== 1) return vFeedback(st, S.score, function () { go(S.step, 1); }, "Finish lesson " + LN, "a");

};
function ring(n, of, from) {

}
function vFeedback(st, s, onNext, label, sub, extra) {

  var from = [];
  if (LN === 2 && S.people[1] && S.people[1].from) from.push(prevTry().people[1].from);
  if (LN === 3) { var pp = prevTry().people; if (s.from2) from.push(pp[0].from); if (s.from1) from.push(pp[1].from); }
  if ((LN === 4 || LN === 5) && s.from) from.push(prevTry().people[0].from);
  var who = LN === 1 ? st.who : s.who;
  /* said again on the one more try: something untrue or a promise still can't pass, so the card says so where the tip would be */
  var still = (s.untrue && !(LN === 5 || LN === 2)) || (s.promise && LN !== 2) ? fixBlock(s, false) : "";
  top({ result: true });
  show(kick(LN === 1 ? st : "Feedback") + '<h1 class="scoreh">' + n + ' of 4</h1><div class="fill">' +
    (who && !(still && extra) ? '<div class="panel short" data-who="' + who + '">' + sceneFace(who) + whoDiv(who) + '</div>' : "") + (LN === 2 ? saidBlock(s.quote) : "") +
    (done.length ? '<div><div class="lbl">' + q(SH.blocks[0]) + '</div><ul class="rows">' + done.join("") + '</ul></div>' : "") +
    (fix.length ? '<div><div class="lbl">' + q(SH.blocks[1]) + '</div><ul class="rows">' + fix.join("") + '</ul></div>' : "") +
    (still ? '<div>' + still + '</div>' : '<div><div class="lbl">' + q(SH.blocks[2]) + '</div><div class="tip">' + q(t < 0 ? L.tipAll : t === 0 && L.parts[0].tipPaid && S.people[0] && !S.people[0].straight ? L.parts[0].tipPaid : L.parts[t].tip) + '</div></div>') +
    from.map(function (f) { return '<div class="from">' + ICON.ok + '<span>' + q(f) + '</span></div>'; }).join("") + (extra || "") + '</div>' + foot(btn(label, "go")), sub);
  if (who) expr(who, n >= 3 ? "warm" : "neutral");
  $("#go").onclick = onNext;
}
function prevTry() { for (var i = L.steps.length - 1; i >= 0; i -= 1) if (L.steps[i].kind === "try2") return L.steps[i]; return L.steps[S.step]; }
function vLessonEnd(st) {
  var left = 5 - LN, open = S.mustOpen && S.mustOpen.length, musts = saved().must || {}, anyOpen = Object.keys(musts).length > 0;

  S.done[S.step] = true; top({ result: true });

    '<div class="panel grow end">' + coverPic() + '</div>' + /* the lesson's picture takes the room the words leave */
    (finish ? '<div><h1 class="lg" style="margin:0">' + q(anyOpen ? SH.ready5wait : SH.ready5) + '</h1><p class="course">' + q(SH.course) + '</p></div>'
      : '<div class="nx"><div class="lbl" style="margin:0">' + q(SH.end.whats) + '</div><p>' + q(SH.end.lead) + '</p><ol>' + SH.titles.map(function (t, i) { return i < LN ? "" : '<li class="' + (i === LN ? "lit" : "") + '"><i>' + (i + 1) + '</i><span>' + q(t) + (i === LN ? ' <em>' + q(SH.end.tomorrow) + '</em>' : "") + '</span></li>'; }).join("") + '</ol></div>') +
    '<div>' + (open || (finish && anyOpen) ? mustNote(open ? LN : other, musts) : "") + '<p class="shift">' + q(L.nextShift) + '</p>' + (L.endExtra ? '<p class="shift sm">' + q(L.endExtra) + '</p>' : "") + '</div></div>' +
    ((finish && anyOpen) || open ? foot(btn(SH.practiceBtn, "prac")) + '<button class="link" id="go">' + q(SH.done) + '</button>' : foot(btn(SH.done, "go"))), LN === 1 ? "" : "b");

  requestAnimationFrame(function () { setTimeout(function () { var a = $(".ring-arc"); if (a) a.setAttribute("stroke-dashoffset", a.getAttribute("data-to")); }, 250); });
}

  show(kick(st) + '<div class="fill"><div class="panel grow end">' + coverPic() + '</div>' + (passed ? '<h1 class="lg" style="margin:0">' + q(SH.passed.replace("{step}", step)) + '</h1>'
    : '<div><div class="lbl">' + q(SH.blocks[2]) + '</div><div class="tip">' + q(s.untrue || s.promise ? (s.promise && !s.untrue ? SH.promise : SH.untrue) : p.tip) + '</div></div><div>' + mustNote(LN, musts) + '</div>') + '</div>' + foot(btn(SH.done, "go")), "p");

function prevIndex() { for (var i = 0; i < L.steps.length; i += 1) if (L.steps[i].kind === "try2") return i; return 0; }

function mustNote(n, musts) { var i = (musts[n] || [])[0], p = DATA.lessons[n] && DATA.lessons[n].parts[i]; return p && p.step ? '<p class="shift" style="color:var(--red)">' + q(SH.practice.replace("{step}", p.step)) + '</p>' : ""; }

/* ---------------- lesson 1's own steps, lesson 4's line checks, the first-shift card ---------------- */
/* how the county checks: four cards, one at a time as the coach reads them */
VIEW.cards = function (st) {

/* sort five lines: Counts or Thrown out, with the reason after each tap */
VIEW.sort = function (st) {

    $("#go").onclick = nextStep; sayLine(st.after, r); return;
  }

    '<div class="opts row" id="opts">' + st.buttons.map(function (b, i) { return '<button class="opt" data-i="' + i + '"><span style="flex:1">' + q(b) + '</span></button>'; }).join("") + '</div><div id="why"></div></div><div id="ft"></div>', "abcdef"[k]);
  if (k === 0) sayLine(st.coach, r);

      var c = $("#coach"); if (c) c.remove();

};
/* say it: the question to Marisol, then why you ask. This is lesson 1's scored part. */
VIEW.say = function (st) {
  var sub = S.sub;

  if (sub === 90) { vReady(st, null, function () { go(S.step, 1); }, fixBlock(S.score, true), "r", true, SH.tryAgain); sayFix(S.score); return; }
  if (sub === 2) return vFeedback(st, S.score, nextStep, nextLabel(), "c", '<div class="tip" style="background:var(--green-soft)">' + q(st.oneWay) + '</div>');
  talk({ st: st, key: "1.marisol", who: st.who, replies: Object.assign({ ask: st.ask, askOther: st.askOther }, st.replies), walk: true, hint: st.hint, hintAfter: "ask|askOther", tag: "b",
    onEnd: function (T) {

    } });
};
/* one whole stop: watch Lena do the job once, then say the two lines that are the law */
VIEW.stop = function (st) {
  var r = RUN + 0, sub = S.sub;
  if (sub === 0) {

    show(kick(st) + '<div class="panel" id="panel"></div><div class="grow" style="flex:0 0 8px"></div>', "a");
    $("#panel").onclick = function () { stopSound(); };

  var finish = function (text) {

    var g = SIGG.grade3(text, ST), said = k === 0 ? g.paid || /\bpaid\b/.test(SIGG.norm(text)) : g.hours && g.tax;

/* the first-shift card: one page, sent when lesson 1 ends */

  /* the card is one page: all eight rules show with no scrolling. The type is as large as fits, and what room is left goes between the rules. */
  var fit = function () {
    var r = $(".rules"); if (!r) return; var li = r.children, f = 18, i;
    for (i = 0; i < li.length; i += 1) li[i].style.marginBottom = "0";
    r.style.fontSize = f + "px";
