/* Warmup signature course (Nov 18, 2026): five five-minute lessons for paid canvassers who gather ballot initiative signatures.
   Source: ai/sig/sig.html, built by ai/tools/build-sig.mjs with the words in ai/sig/content.js and the graders in ai/sig/grade.js.
   The look is the trainings' look (claude/training-playbook.md, part A): Figtree, Newsreader for spoken words, white screens. */
:root {
  --ink: #262320; --muted: #6F685F; --soft: #F3F0EA; --line: #E6E0D6; --bg: #FFFFFF;
  --green: #35B57C; --green-d: #22895A; --green-soft: #E6F5EC; --drive: #5A3E99; --drive-soft: #EFEAF8;
  --red: #C2412D; --red-soft: #FBE8E4; --warm: #E08A1A; --warm-soft: #FDF1DC; --pen: #1F3F8F;
  --u: 1px; color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Figtree", system-ui, -apple-system, sans-serif; }
body { overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 10px) 18px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.top { flex: none; display: flex; align-items: center; gap: 10px; height: 34px; }
.x, .pp { flex: none; width: 34px; height: 34px; border: 0; background: none; padding: 0; display: grid; place-items: center; color: #7A7268; cursor: pointer; }
.x { margin-left: -8px; } span.x { cursor: default; } /* a result screen has no way back; the bar keeps its place */
.x svg { width: 24px; height: 24px; } .pp svg { width: 20px; height: 20px; }
.bar { flex: 1; display: flex; gap: 4px; }
.bar button { flex: 1; height: 26px; border: 0; background: none; padding: 0; cursor: pointer; position: relative; }
.bar button[disabled] { cursor: default; }
.bar button::after { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 6px; border-radius: 3px; background: var(--line); }
.bar button.full::after { background: var(--green); }
.bar button.cur::after { box-shadow: 0 0 0 2px var(--ink); } /* where you are: an outline, never a partly filled bar */
#scr { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; container-type: inline-size; }
.tag { position: absolute; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 2px); font: 600 9px/1 "Figtree"; color: #A69E92; letter-spacing: 0.04em; pointer-events: none; z-index: 30; }
.tag.onpic { background: rgba(255,255,255,.82); color: #6F685F; border-radius: 4px; padding: 2px 4px; }
.kick { flex: none; margin: 10px 0 0; font: 800 calc(12 * var(--u))/1 "Figtree"; letter-spacing: .07em; text-transform: uppercase; color: var(--green-d); }

.grow { flex: 1; min-height: 0; }
.fill { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; padding-top: 12px; }
.fill > :first-child { margin-top: 0; }
.fill > .panel.short { flex: 0 1 30%; height: auto; min-height: 84px; } /* the small picture gives way first when a card is full */
/* the picture */
.panel { flex: 1; min-height: 0; margin-top: 12px; background: var(--soft); border-radius: 20px; overflow: hidden; position: relative; }
.panel.short { flex: 0 0 auto; height: 30%; min-height: 150px; }
.panel > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* a conversation is a FaceTime call: the person fills the screen edge to edge, the mic floats over the picture and the

.ft { flex: 1; min-height: 0; position: relative; margin: 10px -18px calc(-16px - env(safe-area-inset-bottom, 0px)); border-radius: 22px 22px 0 0; overflow: hidden; background: var(--soft); }

.dock.haspet .capt:not(:last-child) { display: none; } /* with the petition on screen only the latest line stays, so it always sits under the chin */
.dock .mic { margin: 0; min-height: 0; background: rgba(255,255,255,.96); border-radius: 40px; padding: 7px 16px 7px 7px; box-shadow: 0 2px 12px rgba(38,35,32,.18); }
.dock .micb { width: calc(58 * var(--u)); height: calc(58 * var(--u)); }
/* people */
.p { transition: transform 1.2s cubic-bezier(.3,.7,.2,1), opacity .5s ease; }
.p.off-l { transform: translateX(-260px); opacity: 0; } .p.off-r { transform: translateX(260px); opacity: 0; }

@keyframes walk { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

@keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(.1); } }
.p .brow { transform-box: fill-box; transform-origin: center; transition: transform .25s ease; }
.p.warm .brow { transform: translateY(-2px); } .p.surprised .brow { transform: translateY(-4px); }
.p.busy .brow-l { transform: rotate(7deg); } .p.busy .brow-r { transform: rotate(-7deg); }
.prop { transition: opacity .35s ease, transform .45s cubic-bezier(.2,.8,.2,1); } .prop.hid { opacity: 0; transform: translateY(14px); }
/* buttons */
.foot { flex: none; display: flex; gap: 10px; margin-top: 12px; align-items: stretch; }
.btn { flex: 1; min-height: 54px; border: 0; border-radius: 16px; background: var(--green); color: #fff; font: 800 calc(17 * var(--u))/1.2 "Figtree"; letter-spacing: .01em; box-shadow: 0 4px 0 var(--green-d); cursor: pointer; padding: 12px 14px; white-space: nowrap; transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-d); }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--line), inset 0 0 0 2px var(--line); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { flex: none; align-self: center; border: 0; background: none; color: var(--muted); font: 600 calc(14 * var(--u))/1.2 "Figtree"; text-decoration: underline; text-underline-offset: 3px; padding: 8px 6px 0; cursor: pointer; }
/* taps */
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.opts.row { flex-direction: row; } .opts.row .opt { flex: 1; justify-content: center; text-align: center; padding: calc(26 * var(--u)) 4px; font: 600 calc(21 * var(--u))/1.1 "Newsreader", Georgia, serif; white-space: nowrap; }
.opts.two { display: grid; grid-template-columns: 1fr 1fr; }
/* a guess between numbers: three big tiles that fill the screen */
.opts.tall { flex: 1; min-height: 0; max-height: calc(380 * var(--u)); }
.opts.tall .opt { flex: 1; min-height: 50px; justify-content: center; align-items: center; text-align: center; font: 600 calc(31 * var(--u))/1 "Newsreader", Georgia, serif; }
.opt { text-align: left; border: 0; border-radius: 16px; background: #fff; box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 var(--line); padding: 13px 14px; font: 700 calc(16 * var(--u))/1.28 "Figtree"; cursor: pointer; transition: background .2s, box-shadow .2s, transform .08s; display: flex; gap: 10px; align-items: flex-start; }
.opt:active { transform: translateY(2px); }
.opt .lt { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font: 800 12px/1 "Figtree"; color: var(--muted); margin-top: -1px; }
.opt.qt { font: 500 calc(16.5 * var(--u))/1.3 "Newsreader", Georgia, serif; }
.opt.right { background: var(--green-soft); box-shadow: inset 0 0 0 2px var(--green), 0 4px 0 var(--green-d); } .opt.right .lt { background: var(--green); color: #fff; }
.opt.wrong { background: var(--red-soft); box-shadow: inset 0 0 0 2px var(--red), 0 4px 0 #9A3222; }
.opt.faded { opacity: .5; }

.opts.done .opt { pointer-events: none; }
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; flex: 1; min-height: 42cqw; max-height: min(70cqw, 360px); }
.pic { border: 0; padding: 0; border-radius: 18px; background: #EFE7D8; box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 var(--line); position: relative; overflow: hidden; cursor: pointer; }
.pic svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: auto; display: block; } /* the picture keeps its full width; a taller tile shows more wall */
.pic::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12%; background: #2F5D50; z-index: 1; }
.pic .lt { position: absolute; left: 8px; top: 8px; width: 26px; height: 26px; border-radius: 50%; background: #fff; display: grid; place-items: center; font: 800 13px/1 "Figtree"; z-index: 2; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.pic.right { box-shadow: inset 0 0 0 3px var(--green), 0 4px 0 var(--green-d); } .pic.right .lt { background: var(--green); color: #fff; }
.pic.wrong { box-shadow: inset 0 0 0 3px var(--red), 0 4px 0 #9A3222; } .pic.faded { opacity: .55; }
.why { flex: none; margin-top: 12px; display: flex; gap: 10px; align-items: flex-start; font: 500 calc(16.5 * var(--u))/1.34 "Newsreader", Georgia, serif; animation: in .3s ease both; text-wrap: pretty; }
.why.plain { font: 600 calc(15.5 * var(--u))/1.38 "Figtree"; }
.why .dot { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: #fff; margin-top: 1px; }
.why .dot.no { background: #B8B0A3; } .why .dot svg { width: 14px; height: 14px; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } }
/* lists of parts and checks */
.lbl { flex: none; margin: 12px 0 0; font: 800 calc(12 * var(--u))/1 "Figtree"; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rows { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: calc(7 * var(--u)); flex: none; }
.rows li { display: flex; gap: 10px; align-items: flex-start; font: 600 calc(15.5 * var(--u))/1.3 "Figtree"; text-wrap: balance; }
.rows .ck { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: #fff; margin-top: -1px; }
.rows .ck svg { width: 13px; height: 13px; }
.rows li.off { color: var(--muted); } .rows li.off .ck { background: #fff; box-shadow: inset 0 0 0 2px #CFC8BC; color: transparent; }
.rows li.fix .ck { background: #fff; box-shadow: inset 0 0 0 2px var(--warm); color: var(--warm); }
.rows li small { display: block; font: 800 calc(10.5 * var(--u))/1 "Figtree"; letter-spacing: .06em; text-transform: uppercase; color: #9B9389; margin-bottom: 3px; }
.rows li.tick { animation: pop .35s ease both; } @keyframes pop { 50% { transform: scale(1.03); } }
.said { flex: none; margin: 12px 0 0; padding: 10px 14px; border-left: 4px solid var(--line); font: 500 calc(15.5 * var(--u))/1.35 "Newsreader", Georgia, serif; color: #4A453F; }
.said b { font: 800 calc(10.5 * var(--u))/1 "Figtree"; letter-spacing: .06em; text-transform: uppercase; color: #9B9389; display: block; margin-bottom: 4px; }
.said.sm { font-size: calc(14 * var(--u)); line-height: 1.3; }
.scoreh { font: 600 calc(36 * var(--u))/1 "Newsreader", Georgia, serif; letter-spacing: -0.01em; margin-top: 6px; }
.tip { flex: none; margin: 8px 0 0; padding: 11px 14px; border-radius: 14px; background: var(--soft); font: 500 calc(16 * var(--u))/1.35 "Newsreader", Georgia, serif; text-wrap: pretty; }
.from { flex: none; margin: 10px 0 0; display: flex; gap: 8px; align-items: center; font: 700 calc(14 * var(--u))/1.3 "Figtree"; color: var(--green-d); }
.from svg { width: 16px; height: 16px; flex: none; }
.callout { flex: none; margin: 14px 0 0; padding: 14px 16px; border-radius: 16px; background: var(--warm-soft); font: 700 calc(17 * var(--u))/1.32 "Figtree"; text-wrap: balance; }
.callout.true { background: var(--green-soft); font: 500 calc(18 * var(--u))/1.34 "Newsreader", Georgia, serif; }

.xo.no svg { background: var(--red); } .xo.no span { color: #8A5A50; text-decoration: line-through; text-decoration-color: rgba(194,65,45,.55); }
.xo.ok svg { background: var(--green); }
.cl2 { margin-top: 10px; font: 800 calc(15.5 * var(--u))/1.2 "Figtree"; }
/* mic */
.mic { flex: none; display: flex; align-items: center; gap: 12px; min-height: 64px; margin-top: 10px; }
.micb { flex: none; width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--green); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 0 var(--green-d); cursor: pointer; position: relative; }

.pet { flex: none; margin-top: 10px; border-radius: 12px; background: #FFFEFA; box-shadow: inset 0 0 0 1.5px #D9D2C4, 0 2px 0 #E6E0D6; padding: 8px 10px 9px; position: relative; overflow: hidden; }
.pet-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.pet-t { flex: 1; min-width: 0; } .pet-t > span { display: block; white-space: nowrap; font: 800 calc(10 * var(--u))/1.2 "Figtree"; letter-spacing: .05em; text-transform: uppercase; color: #5B554D; }
.pet-s { margin-top: 3px; font: 500 calc(9.5 * var(--u))/1.25 "Figtree"; color: #7A7268; }

/* lesson 1's cards */
/* how the county checks: one voter record, four questions that light as the coach reads them */

<div id="app">

<script>
/* The California signature course: the scripted graders and the passersby's side of each spoken try.

   The rules are each lesson's own "Counts" and "Doesn't count" table in claude/signature-curriculum-claude-v2.md, and
   ai/tests/sig-grade.test.mjs replays every example in those tables. It is deterministic on purpose: a try is graded
   the instant the canvasser stops talking, a firm can read exactly why a part did or didn't count, and every rule has a
   replay. Nothing here calls an AI: a passerby says only the lines the script gives them, chosen by what the canvasser
   actually said (the practice voter rules in claude/training-playbook.md, part A4, and ai/voter-rules.md). The firm
   settings come in as an argument; nothing here names a county.

   No exports keyword on purpose: the page inlines this file as is (ai/tools/build-sig.mjs), and node reads it through
   ai/sig/grade.mjs, as with ai/schedule.js. No regex lookbehind: older iPhones can't parse it. */
var SIGG = (function () {

  var PROMISE_RE = /\b(?:yours|your signature|your line|it|that|this|that one|this one|they|theirs)(?: all| definitely| totally)? ?(?:will|'ll|would|is going to|is gonna|are going to|gonna)(?: definitely| totally| still)? count\b|\bi (?:promise|guarantee)\b/;

    new RegExp("\\b" + LIB + "\\b(?: [a-z']+){0,4}? (?:clos(?:e|es|ed|ing|ure|ures)|shut(?:ting)? down|shutdowns?|shut)\\b"),

  var STATEMENT = /\b(?:have to be|has to be|need to be|needs to be|must be|should be|gotta be|got to be|only|if you're|if you are|if they're|who are|who's|who is|i'm|i am|we're|we are|not|looking for|for)$/;
  var MID = /\b(?:um+|uh+|uhm|er+|erm|hmm+|ah|and|but|so|or|because|cause|i|i'?m|i am|my|me|we|we'?re|our|the|a|an|to|for|with|of|in|on|at|about|from|like|just|that|this|is|are|was|am|be|it'?s|you|your|who|what|if|then|also|really|very|here|registered|vote|la|los|angeles|library|longer|hi|hello|hey)$/i;

      .replace(/[‘’ʼ`]/g, "'").replace(/[“”]/g, '"').replace(/&/g, " and ")
      .replace(/\bl\.\s?a\.?(?=[\s,.!?]|$)/g, "la").replace(/\bl a(?= county\b)/g, "la")
      .replace(/[^a-z0-9'? ]+/g, " ").replace(/\?/g, " ? ").replace(/(^|\s)'+|'+(?=\s|$)/g, "$1").replace(/\s+/g, " ").trim();

  var real = function (t) { return words(t).filter(function (w) { return !FILLER.test(w); }); };

    else if (a === "good" && ["morning", "afternoon", "evening", "day"].indexOf(b) >= 0) n = 2;
    else if ((a === "high" || a === "hay" || a === "hei") && GREET_TAIL.indexOf(b) >= 0) n = 1; /* how a phone sometimes spells "hi there" */

    while (GREET_TAIL.indexOf(ws[i + n]) >= 0 || GREET1.indexOf(ws[i + n]) >= 0) n += 1; /* "hi there", "hey everyone", "hi good morning" */

      if (cm && t.slice(end, end + cm.index).trim().split(" ").filter(Boolean).length <= 5 && t.slice(end, end + cm.index).indexOf("?") < 0) { county = true; end = end + cm.index + cm[0].length; }
      else { var pre = t.slice(0, start), pm = pre.match(new RegExp("(?:\\bin )?" + cre.source + "(?: [a-z']+){0,2} ?$")); if (pm) { county = true; start = pre.length - pm[0].length; } }

  /* grade one opener (all of its pieces joined): the four parts and what the passerby would have heard */

    var t = norm(text), ws = words(t), g = greetLen(ws), q = question(t, st), lre = labelRe(st);
    var tm = TIME_RE.exec(t), timeAt = tm ? tm.index : -1;

      greet: g > 0, topic: libAny, long: long, explWords: explWords, untrue: untrue, untrueSaid: um, promise: promise,
      regAsked: !!q, regAt: q ? q.at : -1, county: !!(q && q.county), timeAt: timeAt, timeSaid: tm ? tm[0] : "",
      /* what the passerby hears first, a request for time or the registered question */
      first: timeAt >= 0 && (!q || timeAt < q.at) ? "time" : q ? "reg" : "none",
      void: !!untrue || promise, /* an opener that says something untrue can't be the one that counts */
    };
  }


  /* lesson 1's rule comes back with a passerby who isn't registered: thank her and let her go. Telling her she can
     register counts; "sign anyway" or offering the board doesn't. */
  var PUSH = /\bsign(?: it| this| that| here)?(?: right)? (?:any ?ways?|regardless|though|still)\b|\bstill sign\b|\b(?:go ahead and|just|you can|you could|can still|could still|should still|should|want to) sign\b|\bsign (?:here|right here|this|it|for me|real quick)\b|\bhere(?:'s| is) (?:the|my|a|your) (?:board|petition|pen|clipboard|sheet)\b|\btake (?:the|this|my|a) (?:pen|board|clipboard|petition)\b|\b(?:doesn't|doesnt|does not|don't|dont) matter\b|\b(?:don't|dont|do not) (?:have|need) to be registered\b|\bregistered or not\b/;
  var COURTESY = /\bthank|\bno problem\b|\bno worries\b|\bnot a problem\b|\bthat's (?:ok|okay|fine|all right|alright|cool)\b|\bok(?:ay)?\b|\ball good\b|\bno sweat\b|\bgot it\b|\ball right\b|\balright\b|\bhave a (?:good|great|nice|wonderful|lovely)\b|\bhave a good one\b|\btake care\b|\b(?:good)?bye\b|\bsee you\b/;

    return false;

  /* how long quiet has to last before a passerby answers (playbook A4): 1.2 seconds after a line that sounds finished,
     2.8 when it stops mid-thought or is under three words. The app never cuts a canvasser off. */

  var BYE_RE = /\b(?:good ?)?bye\b|\bsee (?:you|ya)\b|\btake care\b|\bhave a (?:good|great|nice|wonderful|lovely|blessed) (?:one|day|night|evening|afternoon|morning|weekend)\b|\bnever ?mind\b|\bthanks anyway\b|\bforget it\b/;

pletes-petition-verification-for-district-attorney-recall-attempt/"]]],["Apartment numbers count, a different house number doesn't and a mover may re-register by the day they sign",[["2 CCR 20931 and 20940 on the Secretary of State's site","https://www.sos.ca.gov/administration/regulations/current-regulations/elections/petition-processing-signature-verification-ballot-processing-and-ballot-counting"],["Elections Code 105","https://california.public.law/codes/elections_code_section_105"],["Elections Code 2102","https://california.public.law/codes/elections_code_section_2102"]]],["About 1 in 4 thrown out",[["Proposition 3","https://elections.cdn.sos.ca.gov/ccrov/2026/june/26153jh.pdf"],["Proposition 37","https://elections.cdn.sos.ca.gov/ccrov/2026/april/26102jl.pdf"],["Proposition 38","https://elections.cdn.sos.ca.gov/ccrov/2026/june/26161jh.pdf"],["Proposition 39","https://elections.cdn.sos.ca.gov/ccrov/2026/april/26110jh.pdf"],["Proposition 40","https://elections.cdn.sos.ca.gov/ccrov/2026/june/26158jh.pdf"],["Proposition 41","https://elections.cdn.sos.ca.gov/ccrov/2026/june/26160jh.pdf"],["Proposition 42","https://elections.cdn.sos.ca.gov/ccrov/2026/june/26162jh.pdf"],["Proposition 44","https://elections.cdn.sos.ca.gov/ccrov/2026/may/26139jh.pdf"],["Proposition 45","https://elections.cdn.sos.ca.gov/ccrov/2026/june/26156jh.pdf"]],"Warmup's arithmetic from the Secretary of State's nine final reports for 2026"],["The sample of 3%",[["Elections Code 9030","https://california.public.law/codes/elections_code_section_9030"]]],["About 1,000 per double",[["2 CCR 20531 and 20540 on the Secretary of State's site","https://www.sos.ca.gov/administration/regulations/current-regulations/elections/election-petition-signature-verification-random-sampling-verification-methodology"]],"its example weights each duplicate at about 1,075 signatures"],["26 doubles and about 28,000 in LA County",[["the Secretary of State's report on initiative 2017","https://elections.cdn.sos.ca.gov/ccrov/2026/june/26160jh.pdf"]],"Warmup's arithmetic from its LA County row"],["Firms check validity before paying, or track it by canvasser",[["Wilson v. The La Jolla Group","https://law.justia.com/cases/california/court-of-appeal/2021/d077134.html"],["Leo Operations","https://leooperations.com/guides/ballot-measure-signature-gathering/"]]]]},"2":{"n":2,"id":"sig2","title":"How to stop a passerby","parts":[{"name":"Says hello first","done":"Said hello first.","missed":"Didn't start with hello.","tip":"Start with 'Hi there.' A hello turns a stranger into a person."},{"name":"Says what it's for in a few true words","done":"Said what it's for in a few true words.","missed":"Didn't say what it's for.","tip":"Say what it's for in a few true words: 'longer library hours.' Nothing in the measure says libraries are closing, so leave out 'save.'"},{"name":"Asks if they're registered to vote in LA County","done":"Asked if they're registered in LA County.","missed":"Didn't ask about LA County.","tip":"End on the question: 'Are you registered to vote in LA County?' A yes is your stop."},{"name":"Don't ask for a minute or say sorry","done":"Didn't ask for a minute.","missed":"Asked for a minute.","missedAlt":"Said sorry first.","tip":"Drop 'Do you have a minute?' Open with the library and the question."}],"tipAll":"Five seconds, four parts and every word true. Say it to everyone.","headsUp":"Heads up: never ask for a minute.","nextShift":"On your next shift: say your opener to the first 20 people who walk by. Count how many stop.","steps":[{"kind":"try1","name":"Your 1st try","secs":30,"coach":{"who":"coach","text":"You're outside Westside Market with your table and your board. Here comes Ben. He's walking fast. You have five seconds. Get him to stop.","clip":"d1e04eb096ec","dur":6.1},"who":"ben","walk":true,"note":"Ben Feldman, 38, coffee in hand, heading for the door.","replies":{"stop":{"who":"ben","text":"Uh, yeah, I'm registered. What's up?","act":"slow","clip":"c3e4d85e40fd","dur":2.4},"time":{"who":"ben","text":"Sorry, running late!","act":"go","clip":"0ddc74404dd2","dur":1.34},"other":{"who":"ben","text":"Sorry, what's this?","act":"turn","clip":"1202984479cf","dur":1.18}}},{"kind":"hear","name":"Hear it done","secs":40,"coach":{"who":"coach","text":"Now listen to Lena. She does this all day.","clip":"55e9361b692e","dur":2.54},"scenes":[{"who":"tanya","note":"Lena stands in front of her table, board in hand. Tanya Brooks, 45, pushes a cart with her daughter riding in it.","lines":[{"who":"lena","text":"Hi there! Longer library hours. Are you registered to vote in LA County?","clip":"78588576fb7e","dur":5.42},{"who":"tanya","text":"I am, yeah.","act":"slow","clip":"e89085be8a91","dur":1.3}],"ticks":[{"who":"coach","text":"One. She said hi first.","clip":"0e65e762b0f4","dur":1.42},{"who":"coach","text":"Two. She said what it's for in three true words.","clip":"2828a6db7036","dur":2.95},{"who":"coach","text":"Three. She asked if Tanya is registered to vote in LA County. A yes means Tanya can sign, and now they're talking.","clip":"7dfbe03fba69","dur":7.18},{"who":"coach","text":"Four. She never asked for a minute. The whole thing took five seconds.","clip":"827b97e299e1","dur":4.22}]},{"who":"dwayne","note":"Dwayne Carter, 58, walks up.","lines":[{"who":"lena","text":"Hi there! Longer library hours. Are you registered to vote in LA County?","clip":"78588576fb7e","dur":5.42},{"who":"dwayne","text":"Nope. Never got around to it.","clip":"bf2ec9e59076","dur":1.78},{"who":"lena","text":"No problem. Have a good one!","act":"go","clip":"29390baa75b5","dur":2.21}],"after":{"who":"coach","text":"Dwayne can't sign, so Lena lets him go and turns to the next person. That 'no' just saved her a minute.","clip":"bb529beca8e8","dur":5.59}}]},{"kind":"taps","name":"Where to stand","secs":35,"coach":{"who":"coach","text":"Words are half of it. The other half is where you stand.","clip":"e357ebde0f0d","dur":2.83},"qs":[{"ask":"Tap the canvasser who gets more  next person is five seconds away.","clip":"180f6f22af76","dur":11.88}}]},{"kind":"try2","name":"Your 2nd try, three in a row","secs":100,"coach":{"who":"coach","text":"Your turn again. Three people are coming, one after another. Say your opener to each. Your best one counts.","clip":"5ae78631ae3d","dur":6.58},"people":[{"who":"soojin","walk":true,"note":"Soo-jin Kim, 67, with a tote bag.","replies":{"stop":{"who":"soojin","text":"Yes, I am, dear.","act":"slow","clip":"ff47f8b520b0","dur":1.34},"other":{"who":"soojin","text":"Sorry, what's this for?","act":"turn","clip":"fd6acdb2fd46","dur":1.27}}},{"who":"kayla","walk":true,"note":"Kayla Jones, 24, earbuds in.","replies":{"not":{"who":"kayla","text":"Oh. I'm not registered.","act":"turn","clip":"9e38c66b5c71","dur":1.87},"bye":{"who":"kayla","text":"Thanks! Have a good one.","act":"go","clip":"efa66a895367","dur":1.34}},"from":"From lesson 1: you let her go."},{"who":"luis","walk":true,"note":"Luis Ortega, 29, in a kitchen apron, heading to work.","replies":{"stop":{"who":"luis","text":"Yeah, I'm registered.","act":"slow","clip":"3f7c7286bf69","dur":1.68},"other":{"who":"luis","text":"Sorry, what's this for?","act":"turn","clip":"c63fe14a4c29","dur":1.39}}}]},{"kind":"end","name":"Feedback and lesson done","secs":30}],"sources":[["Five or six stops per hundred",[["KPBS, 2016","https://www.kpbs.org/news/2016/may/11/california-elections-are-bonanza-signature-gathere/"]],"one strategist's estimate"],["A spoken ask raises givers and a third of shoppers avoid it",[["Andreoni, Rao and Trachtman","https://econweb.ucsd.edu/~jandreon/WorkingPapers/AndreoniRaoTrachtman.pdf"]],"a charity study used here as an analogy"],["Direct requests, eye contact, smiling and a small first request",[["Hadi and colleagues, Voluntas, 2026","https://www.cambridge.org/core/journals/voluntas/article/state-of-the-art-and-future-research-directions-in-facetoface-fundraising-a-systematic-literature-review/F15A95B216CC7CD05E92E7C29A1F72CD"]],"a review of charity fundraising studies"],["Hourly benchmarks",[["Change Laws Now post","https://www.career.com/job/change-laws-now/petition-circulator/j202604120919356252670"],["Wilson v. The La Jolla Group","https://law.justia.com/cases/california/court-of-appeal/2021/d077134.html"],["NJ Libertarian Party","https://njlp.org/news-top/35-candidates/169-petitioning"],["Clean the Darn Air","https://www.cleanthedarnair.org/guide-to-signature-gathering-in-utah/"]]],["Greet warmly, make eye contact, walk toward people",[["Arizona's training guide","https://wickenburgaz.gov/DocumentCenter/View/11663/Petition-Circulation-Training-Guide-from-SOS"]]],["Stand in front of the table and invite people over",[["Public Citizen","https://www.citizen.org/article/tips-for-petitioning-in-your-community/"]]],["Fast stopper lines, and not blocking traffic",[["CFER tips for petitioners","https://cfer.org/campaign/petitioners.html"]]],["A voter question as the opener",[["a Reclaim Idaho volunteer's tactics","https://medium.com/cam-crow/individual-tactics-for-collecting-ballot-initiative-signatures-b2a628251f17"],["SF Examiner","https://www.sfexaminer.com/after-dealing-drugs-in-las-vegas-he-found-signature-gathering-more-lucrative/article_3f4e108c-ed94-5c47-8abe-ee9c8cf5fdff.html"]]],["The label has to be true",[["Elections Code 18600","https://california.public.law/codes/elections_code_section_18600"]]],["Registered voters of one county",[["Elections Code 100","https://california.public.law/codes/elections_code_section_100"],["Elections Code 9021","https://california.public.law/codes/elections_code_section_9021"]]]]},"3":{"n":3,"id":"sig3","title":"How to ask for the signature","parts":[{"name":"Says they're paid and shows the top funders","must":"Saying you're paid and showing the funders is a must. One more time.","done":"Said you're paid and showed the top funders.","missed":"Didn't say you're paid.","missedAlt":"Didn't show the top funders.","tip":"Say 'I'm paid to gather these signatures' and show the top funders before the petition leaves your hand. Both are the law."},{"name":"Says what it does and how it's paid for","must":"Both halves are a must. One more time.","done":"Said what it does and how it's paid for.","missed":"Left out how it's paid for.","missedAlt":"Left out what it does.","tip":"Tell both halves every time: what it does and how it's paid for."},{"name":"Asks if they've signed this one already","done":"Asked if she signed this one already.","missed":"Didn't ask about a double.","tip":"Ask 'Have you signed this one already?' before the pen moves."},{"name":"Asks for the signature and leaves the choice with them","done":"Asked for the signature.","missed":"Didn't ask for the signature.","tip":"End by asking: 'Will you sign to put it on the ballot?' Hold out the pen. People sign when they're asked."}],"tipAll":"Paid, both halves, no doubles and a clear ask. That's a signature you can stand behind.","headsUp":"Heads up: say you're paid and show the top funders before the petition leaves your hand.","nextShift":"On your next shift: say you're paid and show the top funders before the petition leaves your hand, every time.","steps":[{"kind":"try1","name":"Your 1st try","secs":35,"coach":{"who":"coach","text":"Tanya stopped for you. Now get her signature.","clip":"4e13a85f28b9","dur":3.05},"who":"tanya","note":"Tanya Brooks, 45, with her cart.","opens":{"who":"tanya","text":"Yeah, I'm registered. What's this about?","clip":"8534e7df6156","dur":1.73},"replies":{"yes":{"who":"tanya","text":"Okay, sure.","act":"pen","clip":"094ccf6b25cc","dur":0.7},"wait":{"who":"tanya","text":"So, do you need something from me?","clip":"25feb5e2350f","dur":1.75},"nodbl":{"who":"tanya","text":"No, I haven't signed it.","clip":"592b01e22c13","dur":1.49}}},{"kind":"hear","name":"Hear it done","secs":45,"coach":{"who":"coach","text":"Listen to Lena with Bob.","clip":"11ce2c8be9e7","dur":1.44},"scenes":[{"who":"bob","stopped":true,"note":"Bob Hall, 73, has stopped.","lines":[{"who":"bob","text":"I'm registered. What've you got?","clip":"613b2faa0b12","dur":2.21},{"who":"lena","text":"Thanks for stopping. I'm paid to gather signatures, and here are this month's top funders.","act":"sheet","clip":"9f3b601a46f2","dur":5.9},{"who":"lena","text":"It's the Neighborhood Libraries Act. It funds longer evening and weekend hours at branch libraries, and it's paid for by a new state tax on digital ad sales. Have you signed this one already?","clip":"cf129423660d","dur":12.02},{"who":"bob","text":"No, first I've heard of it.","clip":"30c0f677aeb5","dur":1.49},{"who":"lena","text":"Then here's the petition. It's all there to read. Will you sign to put it on the ballot?","act":"board","clip":"12f0d94508f7","dur":5.5},{"who":"bob","text":"All right.","act":"pen","clip":"b13c271b0c6a","dur":0.7}],"ticks":[{"who":"coach","text":"One. She said she's paid and showed the top funders before the petition left her hand. Both are the law.","clip":"b5e59add0eea","dur":6.14},{"who":"coach","text":"Two. She told both halves: what it does and how it's paid for.","clip":"5a87c7b72af1","dur":4.49},{"who":"coach","text":"Three. She asked if he signed already. A double can cost the drive a thousand signatures.","clip":"b2201019cd97","dur":5.23},{"who":"coach","text":"Four. She asked for the signature and left the choice with Bob. People sign when they're asked.","clip":"17ac2b4630e9","dur":5.28}]}]},{"kind":"taps","name":"Four taps on honest wording","short":"honest wording","secs":55,"qs":[{"ask":"Which one can you say?","opts":["It keeps our libraries from closing.","It funds longer evening and weekend hours at branch libraries, paid for by a new state tax on digital ad sales.","It gives libraries more hours and it won't cost you a thing."],"quote":true,"right":1,"after":{"who":"coach","text":"B. It says what the measure does and how it's paid for. Nothing in the measure says libraries are closing. And nobody can promise what a tax will cost someone.","c     for (var i = 0; i < st.cards.length; i += 1) { $("#stack").children[i].classList.add("on"); if (!(await sayLine(st.cards[i], r))) return; await wait(150); }
    $("#coach").innerHTML = q(st.after.text);
    if (!(await sayLine(st.after, r))) return;
    $("#go").classList.remove("ghost");
  })();
};
/* sort six lines: Counts or Thrown out, with the reason after each tap */
VIEW.sort = function (st) {
  var r = RUN + 0, k = S.sub, n = st.cards.length;
  top({});
  if (k >= n) {
    var out = st.cards.filter(function (c) { return c.right === 1; });
    show(kick(st) + '<div class="fill"><div class="faces">' + out.map(function (c) { return '<div>' + face(c.face) + esc(CAST[c.face].name) + '</div>'; }).join("") + '</div><div class="coach q3" style="font-size:calc(19 * var(--u))">' + q(st.after.text) + '</div></div>' + foot(btn(nextLabel(), "go")), "g");
    $("#go").onclick = nextStep; sayLine(st.after, r); return;
  }
  var C = st.cards[k];
  show(kick(st) + (k === 0 ? '<div class="coach" id="coach">' + q(st.coach.text) + '</div>' : "") + '<div class="count">' + (k + 1) + " of " + n + '</div><div class="fill"><div class="panel short">' + sceneFace(C.face) + '</div><p class="sctext">' + q(C.text) + '</p>' +
    '<div class="opts row" id="opts">' + st.buttons.map(function (b, i) { return '<button class="opt" data-i="' + i + '"><span style="flex:1">' + q(b) + '</span></button>'; }).join("") + '</div><div id="why"></div></div><div id="ft"></div>', "abcdef"[k]);
  if (k === 0) sayLine(st.coach, r);
  [].forEach.call(document.querySelectorAll("#opts button"), function (b) {
    b.onclick = function () {
      var i = +b.getAttribute("data-i"), box = $("#opts"); if (box.classList.contains("done")) return; box.classList.add("done"); stopSound();
      [].forEach.call(box.children, function (x, j) { x.classList.add(j === C.right ? "right" : j === i ? "wrong" : "faded"); x.disabled = true; });
      var c = $("#coach"); if (c) c.remove();
      $("#why").innerHTML = why(i === C.right, C.why, true);
      $("#ft").innerHTML = foot(btn(k + 1 < n ? "Next line" : "Next: the four you threw out", "go"));
      $("#go").onclick = function () { go(S.step, k + 1); };
    };
  });
};
/* say it: the question to Marisol, then why you ask. This is lesson 1's scored part. */
VIEW.say = function (st) {
  var sub = S.sub;
  if (sub === 0) return vReady(st, st.coach, function () { S.retried = false; go(S.step, 1); });
  if (sub === 90) { vReady(st, null, function () { go(S.step, 1); }, fixBlock(S.score, true), "r", true); return; }
  if (sub === 2) return vFeedback(st, S.score, nextStep, nextLabel(), "c", '<div class="tip" style="background:var(--green-soft)">' + q(st.oneWay) + '</div>');
  talk({ st: st, key: "1.marisol", who: st.who, replies: Object.assign({ ask: st.ask }, st.replies), walk: true, note: st.note, hint: st.hint, hintAfter: "ask", tag: "b",
    onEnd: function (T) {
      var g = T.grade(); g.musts = [];
      if ((g.promise || g.untrue) && !S.retried) { S.retried = true; S.score = g; return go(S.step, 90); } /* a promise or something untrue: one more try */
      S.score = g; go(S.step, 2); /* the one more try is the one that stands: a promise or an untrue line can't be averaged away */
    } });
};
/* one whole stop: watch Lena do the job once, then say the two lines that are the law */
VIEW.stop = function (st) {
  var r = RUN + 0, sub = S.sub;
  if (sub === 0) {
    top({ pp: true });
    show(kick(st) + '<div class="panel" id="panel"></div><div class="grow" style="flex:0 0 8px"></div>', "a");
    $("#panel").onclick = function () { stopSound(); };
    playScenes({ coach: st.coach, labels: st.labels, scenes: [{ who: st.who, lines: st.lines, after: st.after }] }, "lena").then(function (ok) { if (ok && r === RUN) go(S.step, 1); });
    return;
  }
  var k = sub - 1, line = st.say[k], T = { n: 0 };
  top({});
  show(kick(st) + '<div class="panel" id="panel">' + sceneTwo("lena", st.who, "") + '</div><div class="sayq"><small>' + q(st.sayLead) + '</small>“' + q(line) + '”</div><div class="coach" id="coach" style="min-height:0"></div>' + micHtml() + '<div id="ft"></div>', "bc"[k]);
  var finish = function (text) {
    if (SIGG.misheard(text)) { micState("idle", "<b>" + q(SH.misheard) + "</b>"); return; }
    /* "Say each one once": the line has to be the line. Something untrue gets "Said something that isn't true." and the line
       stays up. Other words get "I missed that. Try once more." twice, then the lesson moves on so nobody is stuck here. */
    var g = SIGG.grade3(text, ST), said = k === 0 ? g.paid || /\bpaid\b/.test(SIGG.norm(text)) : g.hours && g.tax;
    if (SIGG.untrueOf(text)) { micState("idle", "<b>" + q(SH.untrue) + "</b>"); return; }
    T.n += 1;
    if (!said && T.n < 3) { micState("idle", "<b>" + q(SH.misheard) + "</b>"); return; }
    M.used = true; micState("wait", "");
    if (k + 1 < st.say.length) return go(S.step, sub + 1);
    $("#coach").innerHTML = q(st.done.text);
    sayLine(st.done, r).then(function () { if (r !== RUN) return; $(".mic").style.display = "none"; $("#ft").innerHTML = foot(btn(nextLabel(), "go")); $("#go").onclick = nextStep; });
  };
  if ($("#mic")) { micState("idle"); $("#mic").onclick = function () { if (!SR) { typedOn(finish); return; } if (M.rec) { M.rec.stop(); return; } audio(); stopSound(); micState("on"); M.rec = listen({ onWords: function (t) { var m = $("#mict"); if (m) m.innerHTML = "<b>Listening.</b> " + esc(t); }, onDone: function (t) { M.rec = null; if (r === RUN) finish(t); }, onError: function (c) { M.rec = null; if (r === RUN) micState("idle", micErr(c)); } }); }; }
};
/* check four lines: tap the box that gets the line thrown out, or Good to go */
VIEW.lines = function (st) {
  var r = RUN + 0, k = S.sub, X = st.lines[k], last = k === st.lines.length - 1;
  top({});
  show(kick(st) + (k === 0 ? '<div class="coach q3" id="coach">' + q(st.coach.text) + '</div>' : "") + '<div class="count">Line ' + X.tag + '</div><div id="pw">' + pet(X.fill, { tap: true, big: true, note: X.note }) + '</div>' +
    '<div class="fill"><div class="opts" id="opts"><button class="opt" id="okb"><span style="flex:1;text-align:center">' + q(st.ok) + '</span></button></div><div id="why"></div></div><div id="ft"></div>', "abcd"[k]);
  if (k === 0) sayLine(st.coach, r);
  var done = false, pick = function (key) {
    if (done) return; done = true; stopSound();
    var marks = {}; if (X.right !== "ok") marks[X.right] = "right"; if (key !== X.right && key !== "ok") marks[key] = "wrong";
    $("#pw").innerHTML = pet(X.fill, { big: true, note: X.note, marks: marks }); fitHw();
    $("#okb").classList.add(X.right === "ok" ? "right" : key === "ok" ? "wrong" : "faded"); $("#okb").disabled = true; $("#opts").classList.add("done");
    var c = $("#coach"); if (c) c.remove();
    $("#why").innerHTML = why(key === X.right, X.why, true);
    $("#ft").innerHTML = foot(btn(last ? nextLabel() : "Next line", "go")); $("#go").onclick = function () { last ? nextStep() : go(S.step, k + 1); };
  };
  $("#pw").onclick = function (e) { var b = e.target.closest ? e.target.closest("[data-box]") : null; if (b) pick(b.getAttribute("data-box")); };
  $("#okb").onclick = function () { pick("ok"); };
};
/* your line: the declaration. Two of three cost the whole sheet; tap both. */
VIEW.decl = function (st) {
  var r = RUN + 0, sel = [];
  top({});
  show(kick(st) + '<div class="coach q3" id="coach">' + q(st.coach.text) + '</div><h1 style="font-size:calc(19 * var(--u))">' + q(st.ask) + '</h1><div class="opts" id="opts">' +
    st.cards.map(function (c, i) { return '<button class="decl" data-i="' + i + '"><span class="lt" style="flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font:800 12px/1 Figtree;color:var(--muted)">' + (i + 1) + '</span><span>' + q(c) + '</span></button>'; }).join("") + '</div><div class="fill"><div id="why"></div></div><div id="ft"></div>', "");
  sayLine(st.coach, r);
  [].forEach.call(document.querySelectorAll(".decl"), function (b) {
    b.onclick = function () {
      var i = +b.getAttribute("data-i"); if (sel.length >= 2) return;
      if (sel.indexOf(i) >= 0) { sel.splice(sel.indexOf(i), 1); b.classList.remove("sel"); return; }
      sel.push(i); b.classList.add("sel");
      if (sel.length < 2) return;
      stopSound();
      [].forEach.call(document.querySelectorAll(".decl"), function (x, j) { x.classList.remove("sel"); x.classList.add(st.right.indexOf(j) >= 0 ? "right" : sel.indexOf(j) >= 0 ? "wrong" : "keep"); x.disabled = true; });
      var ok = st.right.every(function (x) { return sel.indexOf(x) >= 0; }); $("#opts").classList.add("done");
      $("#coach").remove();
      $("#why").innerHTML = why(ok, st.after.text);
      $("#ft").innerHTML = foot(btn(nextLabel(), "go")); $("#go").onclick = nextStep;
      sayLine(st.after, RUN);
    };
  });
};
/* the first-shift card: one page, sent when lesson 1 ends */
function vCard() {
  var C = DATA.card;
  $("#top").innerHTML = ""; $("#top").style.display = "none"; $("#tag").textContent = "Sig card"; /* the card has no lesson bar, so the rules get its room */
  $("#scr").innerHTML = '<span class="drive"><b>' + esc(ST.drive.name) + '</b><small>' + esc(ST.drive.measure) + ' · petition drive</small></span><h1 class="lg">' + q(C.title) + '</h1><ol class="rules">' + C.rules.map(function (x) { return '<li><b>' + q(x[0]) + '</b> ' + q(x[1]) + '</li>'; }).join("") + '</ol>';
  /* the card is one page: all eight rules show with no scrolling. The type is as large as fits, and what room is left goes between the rules. */
  var fit = function () {
    var r = $(".rules"); if (!r) return; var li = r.children, f = 18, i;
    for (i = 0; i < li.length; i += 1) li[i].style.marginBottom = "0";
    r.style.fontSize = f + "px";
    while (f > 10.5 && r.scrollHeight > r.clientHeight + 0.5) { f -= 0.25; r.style.fontSize = f + "px"; }
    var used = 0; for (i = 0; i < li.length; i += 1) used += li[i].getBoundingClientRect().height;
    var gap = Math.max(0, Math.min(16, Math.floor((r.clientHeight - used - 1) / (li.length - 1))));
    for (i = 0; i < li.length - 1; i += 1) li[i].style.marginBottom = gap + "px";
  };
  fit(); window.addEventListener("resize", fit); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
}

/* ---------------- start ---------------- */
document.title = LN ? "Lesson " + LN + ": " + L.title + " · Warmup" : "Before your first signature · Warmup";
if (!LN) vCard();
else if (qs.has("at")) { var at0 = qs.get("at").split("."); S.step = -1; go(Math.max(0, Math.min(L.steps.length - 1, (parseInt(at0[0], 10) || 1) - 1)), parseInt(at0[1], 10) || 0); }
else go(-1);
window.__sgBusy = function () { return playing.length > 0; };
window.__sg = { S: S, go: go, L: L, LN: LN, time: function () { var now = performance.now(), ms = Object.assign({}, TM.ms); if (TM.at >= 0) ms[TM.at] = (ms[TM.at] || 0) + now - TM.t0; return ms; }, run: function () { return RUN; }, M: M };

})();
</script>
