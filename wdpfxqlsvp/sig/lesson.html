/* Warmup signature course (Nov 18, 2026): five five-minute lessons for paid canvassers who gather ballot initiative signatures.
   Source: ai/sig/sig.html, built by ai/tools/build-sig.mjs with the words in ai/sig/content.js and the graders in ai/sig/grade.js.
   The look is Warmup's one frame, the door-knocking lessons' (Robert's pick, Nov 20, 11:53 AM; playbook rules 58 and 62a): cream
   screens, Newsreader headlines, the campaign's name on top, dark buttons and the Tap to talk button. The world stays the course's
   own: the sidewalk, its people and the walking passersby. */
:root {
  --ink: #262320; --ink-2: #5B554D; --muted: #6F685F; --paper: #FCF8F2; --card: #FFFDF9; --soft: #F4EEE5; --line: #E3DBCF; --track: #E6DFD3; --bg: var(--paper);
  --green: #35B57C; --green-d: #1B7A4D; --green-soft: #DDF0E4; --drive: #5A3E99; --drive-soft: #EFEAF8;
  --head: "Newsreader", Georgia, serif;
  --red: #C2412D; --red-soft: #FBE8E4; --warm: #E08A1A; --warm-soft: #FDF1DC; --pen: #1F3F8F;
  --u0: 1px; --u: var(--u0); color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Figtree", system-ui, -apple-system, sans-serif; }
body { overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 10px) 20px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.top { flex: none; display: block; }
.top .row { display: flex; align-items: center; gap: 4px; height: 46px; margin-top: 4px; }
.top .row .sp { flex: 1; }
.top .drive { margin: 0; } .top .drive b { font-size: 24px; line-height: .92; } .top .drive small { font-size: 8px; letter-spacing: .04em; margin-top: 4px; } /* the door-knocking lessons' campaign name, at their size */
.x, .pp { flex: none; width: 34px; height: 34px; border: 0; background: none; padding: 0; display: grid; place-items: center; color: var(--ink); cursor: pointer; }
.x { margin-left: -9px; } span.x { cursor: default; } /* a result screen has no way back; the bar keeps its place */
.x svg { width: 24px; height: 24px; } .pp svg { width: 20px; height: 20px; }
/* the four steps, by name (Robert, Nov 20, 8:23 AM; playbook rule 56): one segment each, filling as its screens are done, and the
   one you're in named in green. The names may run a little past their segment, as the door-knocking lessons' do. */
.bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 6px 0 0; }
.bar button { min-width: 0; border: 0; background: none; padding: 0 0 2px; cursor: pointer; display: block; text-align: center; }
.bar button[disabled] { cursor: default; }
.bar button i { display: block; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar button i b { display: block; height: 100%; border-radius: inherit; background: var(--green); transition: width .4s ease; }
.bar button span { display: block; margin: 5px -4px 0; font: 700 10.5px/1.2 "Figtree"; letter-spacing: 0; white-space: nowrap; color: var(--muted); } /* as the door-knocking lessons' names */
.bar button.cur span { color: var(--green-d); } /* the step you're in: its name in green and a little green in its segment, as the door-knocking lessons mark it */
#scr { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; container-type: inline-size; --u: calc(var(--u0) * var(--k, 1)); }
/* fill: a screen with room to spare grows its words and pictures together (--k, set by fillUp in the engine) until the room is
   used, so no blank band is left. The main button keeps its size, so its words stay on one line. */
#scr > #ft, #scr > .foot, #scr > .link { --u: var(--u0); }
/* while fillUp measures, the blocks sit packed at the sizes they would like: nothing stretched, nothing squeezed */
#scr.fitting > .fill, #scr.fitting > .opts.decls { flex: 0 0 auto; justify-content: flex-start; }
#scr.fitting > *, #scr.fitting > .fill > * { flex-shrink: 0; }
#scr.fitting .faces.big { flex: 0 0 auto; height: calc(2 * min(132 * var(--u), 50cqw - 30px) + 60px); }
.tag { position: absolute; right: 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 2px); font: 600 9px/1 "Figtree"; color: #A69E92; letter-spacing: 0.04em; pointer-events: none; z-index: 30; }
.tag.onpic { background: rgba(255,255,255,.82); color: #6F685F; border-radius: 4px; padding: 2px 4px; }
.kick { flex: none; margin: 10px 0 0; font: 700 calc(12.5 * var(--u))/1 "Figtree"; letter-spacing: .08em; text-transform: uppercase; color: var(--green-d); }
h1 { flex: none; font: 500 calc(22.4 * var(--u))/1.15 var(--head); letter-spacing: -0.01em; margin: 8px 0 0; text-wrap: balance; } /* the door-knocking lessons' headline (.h2) */
h1.lg { font-size: calc(30 * var(--u)); line-height: 1.08; letter-spacing: -0.015em; } /* and their title (.h1) */
.sub { flex: none; font: 500 calc(16 * var(--u))/1.4 "Figtree"; color: var(--muted); margin: 8px 0 0; text-wrap: pretty; }
.grow { flex: 1; min-height: 0; }
.fill { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; padding-top: 12px; }
.fill > :first-child { margin-top: 0; }
.fill > #why:empty { display: none; } /* an answer that isn't on screen yet takes no room */
.fill > .panel.short { flex: 1 1 calc(190 * var(--u)); height: auto; min-height: 84px; } /* and it takes any room the card has left over, so the words keep their size */ /* the small picture gives way first when a card is full */
/* the picture */
.panel { flex: 1; min-height: 0; margin-top: 12px; background: var(--soft); border-radius: 20px; overflow: hidden; position: relative; }
.panel.short { flex: 0 0 auto; height: 30%; min-height: 150px; }
.panel > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.panel > svg.fitw { height: auto; bottom: auto; } /* a wide picture always shows its full width; a short panel crops it from the bottom */
/* the painted pictures (playbook rule 67): each fills its frame, shifted by place() so faces sit where the screen needs them */
.ph { position: absolute; inset: 0; overflow: hidden; background: #E9E1D2; }
.ph .fr { position: absolute; left: var(--ox, 0px); top: var(--oy, 0px); width: var(--rw, 100%); height: var(--rh, 100%); } /* place() sizes and moves the picture */
.ph .fr { opacity: 0; transition: opacity .25s ease; } .ph .fr.ok { opacity: 1; }
.ph .fr > .bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ph .pt { position: absolute; transition: transform 1.5s cubic-bezier(.2,.65,.25,1), opacity .5s ease; transform-origin: 50% 100%; }
.ph .pt .bob { position: absolute; inset: 0; }
.ph .pt img { position: absolute; display: block; }
.ph .pt .cut { inset: 0; width: 100%; height: 100%; }
.ph .pt .alt { opacity: 0; transition: opacity .3s ease; } .ph .pt .alt.on { opacity: 1; } .ph .pt.alton .cut:not(.alt) { opacity: 0; transition: opacity .3s ease; }
.ph .pt .mo, .ph .pt .bl { opacity: 0; } .ph .pt .bl.on { opacity: 1; } /* the talking mouth and the closed eyes, shown by the page as the voice plays and now and then */
/* a passerby walks in over the storefront while the line plays (rule 54a): from your left toward the door, or from the right toward the canvasser */
.ph.one.off .pt.walker { transform: translateX(-55%) scale(.9); opacity: 0; } .ph.two.off .pt.walker { transform: translateX(42%) scale(.95); opacity: 0; }
.ph.one.gone .pt.walker { transform: translateX(58%) scale(.92); opacity: 0; } .ph.two.gone .pt.walker { transform: translateX(46%) scale(.95); opacity: 0; }
.ph.walking .pt.walker { transition: opacity .5s ease; will-change: transform; } .ph.walking.gone .pt.walker { opacity: 1; } /* lesson 2: the engine walks them across, and off */
.ph.walk .pt.walker .bob { animation: walkph .56s ease-in-out infinite; } @keyframes walkph { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.1%); } }
.ph.close img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; }
@media (prefers-reduced-motion: reduce) { .ph.walk .pt.walker .bob { animation: none; } .ph .pt { transition: opacity .5s ease; } }
/* a cover and the beat before a try have few words, so on a tall phone their picture would show a band of empty pavement.
   There the panel stops growing at the picture's own height (--cap, with a little ground under the shoes), and the room that
   is left goes to the words (fillUp). The storefront with nobody in it first draws up to a quarter larger, cropped at its
   sides, so it fills a tall panel */
.panel.cap:has(> .ph.two), .panel.cap:has(> .ph.shop), .panel.cap:has(> .ph.one) { --cap: 148cqw; max-height: var(--cap); margin-bottom: auto; } /* the pictures are 896 by 1216 and 768 by 1344: at the cap, a little of each side is cropped and no pavement band shows */
#scr.fitting > .panel.cap { flex: 0 0 auto; height: var(--cap); margin-bottom: 0; }
.panel.cap ~ .foot { margin-top: auto; padding-top: 12px; } /* any room still left sits half under the picture and half over the button */
#scr.fitting > .panel.cap ~ .foot { margin-top: 0; }
.who { position: absolute; left: 10px; top: 10px; background: rgba(255,255,255,.92); border-radius: 99px; padding: 6px 11px; font: 700 calc(13 * var(--u))/1 "Figtree"; z-index: 2; }
.who.r { left: auto; right: 10px; }
.nextp { flex: none; display: flex; align-items: center; gap: 10px; margin-top: 10px; font: 700 calc(15 * var(--u))/1.2 "Figtree"; }
.nextp svg, .nextp img.av { flex: none; object-fit: cover; width: calc(40 * var(--u)); height: calc(40 * var(--u)); border-radius: 50%; background: var(--soft); }
.capts { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 3; pointer-events: none; }
.capt { max-width: 92%; padding: 9px 13px; border-radius: 16px; font: 500 calc(15 * var(--u))/1.36 "Figtree"; animation: in .22s ease both; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
.capt b { font: 700 calc(15 * var(--u))/1.36 "Figtree"; display: inline; color: var(--ink); } .capt b::after { content: ": "; } /* "Coach: ...", as the door-knocking lessons' "Sofia: ..." */
.capt.them { align-self: flex-start; background: var(--card); border-bottom-left-radius: 5px; }
.capt.you { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 5px; }
.capt.you b { color: #FFFFFF; }
.capt.you.live { background: #4A453F; }
.capt.note { align-self: center; background: rgba(255,253,249,.95); color: var(--ink-2); font: 600 calc(13.5 * var(--u))/1.3 "Figtree"; text-align: center; }
.capt.note b { font: 700 calc(13.5 * var(--u))/1.3 "Figtree"; } .capt.note b::after { content: ": "; } /* a note with a speaker says who ("Coach: Tell her why."); a note without one has no label */
.coach { flex: none; margin: 10px 2px 0; font: 400 calc(16 * var(--u))/1.4 "Figtree"; color: var(--ink-2); text-wrap: pretty; min-height: calc(2 * 1.4 * 16 * var(--u)); }
.coach.q3 { min-height: calc(3 * 1.4 * 16 * var(--u)); }
.coach.dim { opacity: .4; }
/* the coach in writing (?coach=text): its words look as they do on a ready screen, and the only other change is that a caption from the
   coach is a note, not a speech bubble, since nobody is talking. Over a tap question the coach's line comes first. The 1st try's ready
   screen frames the view from above on the walker, who starts near its top. */
.coachw { flex: none; margin: 8px 2px 2px; font: 400 calc(16 * var(--u))/1.4 "Figtree"; color: var(--ink-2); text-wrap: pretty; }
html.textc .capt.cw { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; box-shadow: none; }
.panel.walktop .ph.air img { object-position: 50% 5%; }
.hint { flex: none; margin: 10px 2px 0; font: 700 calc(15 * var(--u))/1.35 "Figtree"; color: var(--ink); }
/* a conversation is a FaceTime call: the person fills a card, as the door-knocking lessons' door does, the latest line from each
   side sits over the chest, never the face, and the talk button sits under the card */
.ft { flex: 1; min-height: 0; position: relative; margin: 10px 0 0; border-radius: 24px; overflow: hidden; background: var(--soft); box-shadow: 0 0 0 1px var(--line); }
.ft > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ft .who { left: 12px; top: 12px; }
.dock { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
.dock .capts { position: static; }
.dock .pet { margin: 0; box-shadow: inset 0 0 0 1.5px #D9D2C4, 0 2px 10px rgba(38,35,32,.14); }
.dock .pet .pet-t > span { letter-spacing: .025em; } /* the card's line takes a little width: the measure's name keeps to one line */
.dock.haspet .capt:not(:last-child) { display: none; } /* with the petition on screen only the latest line stays, so it always sits under the chin */

/* people */
.p { transition: transform 1.2s cubic-bezier(.3,.7,.2,1), opacity .5s ease; }
@keyframes walk { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.p .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.2s infinite; }
@keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(.1); } }
.p .brow { transform-box: fill-box; transform-origin: center; transition: transform .25s ease; }
.p.warm .brow { transform: translateY(-2px); } .p.surprised .brow { transform: translateY(-4px); }
.p.busy .brow-l { transform: rotate(7deg); } .p.busy .brow-r { transform: rotate(-7deg); }
.prop { transition: opacity .35s ease, transform .45s cubic-bezier(.2,.8,.2,1); } .prop.hid { opacity: 0; transform: translateY(14px); }
/* buttons */
.foot { flex: none; display: flex; gap: 10px; margin-top: 12px; align-items: stretch; }
.btn { flex: 1; min-height: 54px; border: 1.5px solid var(--ink); border-radius: 16px; background: var(--ink); color: var(--paper); font: 700 16.5px/1.2 "Figtree"; letter-spacing: .005em; box-shadow: none; cursor: pointer; padding: 12px 14px; white-space: nowrap; transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(1px); }

/* taps */
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.opts.row { flex-direction: row; } .opts.row .opt { flex: 1; justify-content: center; text-align: center; padding: calc(26 * var(--u)) 4px; font: 700 calc(18 * var(--u))/1.1 "Figtree"; white-space: nowrap; }
.opts.two { display: grid; grid-template-columns: 1fr 1fr; }
/* a guess between numbers: three big tiles that fill the screen */
.opts.tall { flex: 1; min-height: 0; }
.opts.tall .opt { flex: 1; min-height: 50px; justify-content: center; align-items: center; text-align: center; font: 600 clamp(calc(31 * var(--u)), 4.6vh, calc(46 * var(--u)))/1 "Newsreader", Georgia, serif; }
.opt { text-align: left; border: 0; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); padding: 13px 14px; font: 700 calc(16 * var(--u))/1.28 "Figtree"; cursor: pointer; transition: background .2s, box-shadow .2s, transform .08s; display: flex; gap: 10px; align-items: flex-start; }
.opt:active { transform: translateY(1px); }

.opt.qt { font: 600 calc(15.5 * var(--u))/1.32 "Figtree"; }
.opt.right { background: var(--green-soft); box-shadow: inset 0 0 0 2px var(--green); } .opt.right .lt { background: var(--green); color: #fff; }
.opt.wrong { background: var(--red-soft); box-shadow: inset 0 0 0 2px var(--red); }

.opts.done .opt { pointer-events: none; }
.pics { display: grid; grid-template-columns: 1fr; grid-auto-rows: 1fr; gap: 10px; margin-top: 14px; flex: 1; min-height: 56cqw; } /* A over B, each as wide as the screen: the two pictures take the room that is left, and each scene is drawn as large as its tile allows */
.pic { border: 0; padding: 0; border-radius: 18px; background: #EFE7D8; box-shadow: inset 0 0 0 1.5px var(--line); position: relative; overflow: hidden; cursor: pointer; }
.pic svg { position: absolute; left: 0; right: 0; bottom: 0; top: 12%; width: 100%; height: 88%; display: block; } /* the scene sits under the awning, so no head is ever behind it */
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 45%; } /* a painting carries the store's own sign */
.pic:has(img)::before { display: none; }

.pic.right { box-shadow: none; } .pic.right .lt { background: var(--green); color: #fff; }
.pic.wrong { box-shadow: none; } .pic.wrong .lt { background: var(--red); color: #fff; } .pic.faded { opacity: .55; }

.pic.right::after { box-shadow: inset 0 0 0 4px var(--green); } .pic.wrong::after { box-shadow: inset 0 0 0 4px var(--red); }
.why { flex: none; margin-top: 12px; display: flex; gap: 10px; align-items: flex-start; font: 500 calc(15.5 * var(--u))/1.38 "Figtree"; animation: in .3s ease both; text-wrap: pretty; }
.why.plain { font: 600 calc(15.5 * var(--u))/1.38 "Figtree"; }

.why .dot.no { background: #B8B0A3; } .why .dot svg { width: 14px; height: 14px; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } }

.lbl { flex: none; margin: 12px 0 0; font: 800 calc(12 * var(--u))/1 "Figtree"; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* mic: the door-knocking lessons' talk button. Dark, with a green mic, "Tap to talk"; while it listens it turns green and says
   "I'm done", and your bubble on the picture says "Listening. Say it your way." until your words come in. A note (a mic that

.checks4 { flex: 1; min-height: 0; margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 10px; }

.decl { align-items: center; } .decl .dpic { flex: none; width: calc(80 * var(--u)); height: auto; }
.opts.decls { flex: 1 1 auto; justify-content: space-evenly; } .opts.decls + .fill { flex: 0 0 auto; } /* the three declarations take the room; the answer takes what it needs */
.sctext { margin: 12px 2px 0; font: 600 calc(17 * var(--u))/1.38 "Figtree"; text-wrap: pretty; }
.sqq { font-weight: 700; font-size: calc(17 * var(--u)); line-height: 1.25; margin: 0 0 calc(8 * var(--u)); }

.sc svg, .sc img.av { flex: none; object-fit: cover; width: calc(72 * var(--u)); height: calc(72 * var(--u)); border-radius: 50%; background: #E4DDD0; }

.faces { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; } .faces div { text-align: center; font: 700 calc(12.5 * var(--u))/1.2 "Figtree"; color: var(--muted); } .faces svg, .faces img.av { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 50%; background: var(--soft); display: block; margin-bottom: 5px; }
.labels { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 5px; z-index: 3; } /* the course line, along the bottom, each label on one line */
.panel.lab .capts { bottom: calc(50 * var(--u)); }
.labels span { flex: 1 1 auto; display: grid; place-items: center; text-align: center; white-space: nowrap; padding: 6px 4px; min-height: calc(34 * var(--u)); border-radius: 9px; background: rgba(255,255,255,.9); font: 800 calc(10.5 * var(--u))/1.15 "Figtree"; color: #A69E92; transition: background .3s, color .3s; }

.decl.sel { box-shadow: inset 0 0 0 2.5px var(--ink); } .decl.right { background: var(--green-soft); box-shadow: inset 0 0 0 2px var(--green); } .decl.wrong { background: var(--red-soft); box-shadow: inset 0 0 0 2px var(--red), 0 4px 0 #9A3222; } .decl.keep { opacity: .6; }
/* Part N of 4: before each step's first screen, as in the door-knocking lessons. The ring fills a fifth more for each step. */
.beat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 0 22px 40px; cursor: pointer; }
.beat-ring { position: relative; width: 104px; height: 104px; margin-bottom: 2px; animation: beatin .3s ease both; }

.beat .beat-k { margin: 0 0 -4px; font: 700 12px/1 "Figtree"; letter-spacing: .1em; text-transform: uppercase; color: var(--green-d); animation: beatin .3s ease both; }

.ringrow { flex: none; display: flex; align-items: center; gap: 16px; margin-top: 14px; }

.nx p { margin: 6px 0 0; font: 600 calc(15 * var(--u))/1.35 "Figtree"; }

.shift { flex: none; margin: 12px 2px 0; font: 700 calc(16 * var(--u))/1.36 "Figtree"; text-wrap: pretty; }
.shift.sm { font-weight: 600; color: var(--muted); font-size: calc(14.5 * var(--u)); }
.course { flex: none; margin: 6px 0 0; font: 600 calc(16 * var(--u))/1.36 "Figtree"; color: var(--ink-2); }
.score { font: 800 calc(26 * var(--u))/1 "Figtree"; letter-spacing: -.02em; } .score small { font: 700 calc(14 * var(--u))/1 "Figtree"; color: var(--muted); letter-spacing: 0; margin-left: 8px; }
/* cover and the card */
.drive { margin-top: 16px; display: inline-flex; flex-direction: column; color: var(--drive); text-transform: uppercase; line-height: 1; }

.rules { flex: 1; min-height: 0; overflow: hidden; margin: 10px 0 0; padding: 0 2px 0 22px; font: 500 16px/1.32 "Figtree"; } .rules li { margin: 0; } .rules b { font-weight: 800; } /* all eight rules on one screen: the type is sized to fit (vCard) */
/* sources */
.sheet { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(20,18,16,.38); animation: fade .2s ease both; }
.sheet > div { background: var(--paper); border-radius: 22px 22px 0 0; max-height: 96%; display: flex; flex-direction: column; padding: 16px 18px calc(env(safe-area-inset-bottom, 0px) + 18px); width: 100%; animation: up .28s cubic-bezier(.2,.8,.2,1) both; }
.sheet h2 { flex: none; font: 500 calc(22 * var(--u))/1.2 var(--head); margin: 0 0 6px; } .sheet ul { flex: 0 1 auto; min-height: 0; margin: 0; padding-left: 17px; font: 500 calc(13 * var(--u))/1.34 "Figtree"; } .sheet li { margin: calc(5 * var(--u)) 0; } .sheet a { color: var(--drive); } .sheet .fine { flex: none; font: 500 calc(12 * var(--u))/1.35 "Figtree"; color: var(--muted); margin: 8px 0 10px; }
.sheet .btn { flex: none; min-height: 46px; }

/* on a laptop the lesson sits in a phone frame */

}

/* ---- version 8 (Robert's notes on lesson 2, Nov 20, 3:51 PM) ---- */
/* the screen number shows only with ?tags ("We don't want that little number there") */
html:not(.tags) .tag { display: none; }
/* a quiet link sits centered under the buttons ("center-aligned underneath the buttons") */
.link { display: block; margin: 10px auto 0; text-align: center; align-self: center; }
#ft > .link, #scr > .link { margin-left: auto; margin-right: auto; }
/* a passerby who walks up: from above, then down the sidewalk toward you, then face to face. #panel[data-stage] picks the view. */
.ph.air, .ph.pov { z-index: 1; opacity: 0; transition: opacity .45s ease; pointer-events: none; background: #E9E1D2; }
.ph.air img, .ph.pov img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }
.ph.air img { will-change: transform; }
.ph.pov .wk { position: absolute; left: 0; top: 0; will-change: transform; }
.ph.pov .wk img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; animation: walkph .56s ease-in-out infinite; }
[data-stage="air"] > .ph.air { opacity: 1; }
[data-stage="pov"] > .ph.pov { opacity: 1; }
[data-stage="air"] > .who, [data-stage="pov"] > .who { opacity: 0; }
.ph.one.here .pt.walker { transition: opacity .45s ease; }
@media (prefers-reduced-motion: reduce) { .ph.pov .wk img { animation: none; } .ph.air img { transition: none !important; } }
/* the canvasser's top funders sheet, held up from the bottom corner (the canvasser never shows) */
.fgs { position: absolute; left: 10px; bottom: 26%; width: 38%; z-index: 2; transform: translateY(40%) rotate(-5deg); opacity: 0; transition: transform .4s ease, opacity .4s ease; filter: drop-shadow(0 6px 14px rgba(38,35,32,.28)); pointer-events: none; }
.fgs.on { transform: translateY(0) rotate(-5deg); opacity: 1; }
.fgs > * { display: block; width: 100%; height: auto; }
/* the live talk card, as the door-knocking lessons have it: a big mic, gray while it starts and green once it listens, bars that move
   while your words come in, and the words. Over the bottom of the picture, where the captions go while it shows. */
.tlive { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 12px 14px 12px 12px; border-radius: 22px; background: var(--card); box-shadow: 0 0 0 1.5px var(--line), 0 6px 24px rgba(0,0,0,.18); animation: vpin .3s ease both; }
@keyframes vpin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#microw > .tlive { margin-bottom: 2px; box-shadow: 0 0 0 1.5px var(--line); }
.dock:has(> .tlive) > .capts { display: none; }
.tlive .tl-mic { position: relative; width: 64px; height: 64px; border-radius: 50%; background: #A69E92; color: #FFFDF9; display: grid; place-items: center; transition: background .3s; }
.tlive.live .tl-mic { background: var(--green); }

.tlive .tl-wave { display: flex; align-items: center; gap: 4px; height: 26px; }

.tlive.talking .tl-wave i { opacity: 1; animation: tlwave .8s ease-in-out infinite; }
.tlive .tl-wave i:nth-child(3n+2) { animation-delay: .15s; } .tlive .tl-wave i:nth-child(3n) { animation-delay: .3s; } .tlive .tl-wave i:nth-child(4n) { animation-delay: .45s; }
@keyframes tlwave { 0%, 100% { height: 6px; } 50% { height: 24px; } }
.tlive .tl-said { margin: 4px 0 0; font: 700 calc(16.5 * var(--u))/1.3 "Figtree"; color: var(--green-d); max-height: 6.5em; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.tlive .tl-said:empty::before { content: attr(data-live); }
.tlive.warm .tl-said:empty::before { content: attr(data-warm); color: var(--muted); }
.tlive.go .tl-said:empty::before { content: attr(data-go); }
@media (prefers-reduced-motion: reduce) { .tlive .tl-pulse, .tlive.talking .tl-wave i, .tlive.go .tl-mic { animation: none; } }
/* your turn to talk: the button's green mic rings, so it's plain what to tap */
.micb.pulse .md::before, .micb.pulse .md::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--green); animation: tlpulse 1.6s ease-out infinite; }
.micb.pulse .md::after { animation-delay: .8s; }
@media (prefers-reduced-motion: reduce) { .micb.pulse .md::before, .micb.pulse .md::after { animation: none; opacity: 0; } }
/* a second example inside a step: its own short card, not a Part N of 4 screen */

.excard small { display: block; font: 700 13px/1.2 "Figtree"; color: var(--green-d); }
.excard b { display: block; margin-top: 6px; font: 500 28px/1.1 var(--head); color: var(--ink); }
.excard p { margin: 10px 0 0; font: 500 16px/1.4 "Figtree"; color: var(--ink-2); text-wrap: balance; }
/* the stop-rate guess: three choices in a row, and a row of 20 passersby that shows the answer */
.p20 { flex: 1 1 auto; min-height: 104px; display: grid; grid-template-columns: repeat(10, 1fr); align-content: center; gap: 10px 4px; margin-top: 14px; padding: 14px 10px; border-radius: 18px; background: var(--soft); }
.p20 i { display: grid; place-items: center; }
.p20 svg { width: 100%; max-width: 28px; height: auto; fill: #C9C1B4; transition: fill .3s ease; }
.p20.done i.stop svg { fill: var(--green); } .p20.done i.half svg { fill: #9ED9BB; } .p20.done i.walk svg { fill: #D8D1C5; }
.opts.row.pct .opt { padding: calc(18 * var(--u)) 4px; font: 600 calc(21 * var(--u))/1.05 var(--head); }
/* the feedback card's one short tip, under the part to fix */
.rows li.tipline { margin: -2px 0 2px 32px; padding: 9px 12px; border-radius: 12px; background: var(--soft); font: 500 calc(14.5 * var(--u))/1.36 "Figtree"; color: var(--ink); text-wrap: pretty; }

<div id="app">
  <div class="top" id="top"></div>
  <div id="scr"></div>
  <div class="tag" id="tag"></div>

<script>
/* The California signature course: the scripted graders and the passersby's side of each spoken try.

    new RegExp("\\b(?:stop|stops|stopping|prevent|prevents|preventing|fight|fighting|end|ending|block|blocking)\\b(?: [a-z']+){0,3}? (?:clos(?:ing|ure|ures|ings)|shut ?downs?)\\b"),

  ];
  var COST = /\bfree\b|\bno (?:new |more |extra )?tax(?:es)?\b|\b(?:won't|wont|will not|doesn't|doesnt|does not|isn't going to|not going to) cost\b|\b(?:no|zero) cost\b|\bwithout (?:raising|new|any) tax(?:es)?\b|\bnot a tax\b|\bcosts? (?:you |taxpayers |anyone |anybody )?nothing\b/;
  /* a statement about being registered isn't the question */
  var STATEMENT = /\b(?:have to be|has to be|need to be|needs to be|must be|should be|gotta be|got to be|only|if you're|if you are|if they're|who are|who's|who is|i'm|i am|we're|we are|not|looking for|for)$/;
  var MID = /\b(?:um+|uh+|uhm|er+|erm|hmm+|ah|and|but|so|or|because|cause|i|i'?m|i am|my|me|we|we'?re|our|the|a|an|to|for|with|of|in|on|at|about|from|like|just|that|this|is|are|was|am|be|it'?s|you|your|who|what|if|then|also|really|very|here|registered|vote|la|los|angeles|library|longer|hi|hello|hey)$/i;

      .replace(/[‘’ʼ`]/g, "'").replace(/[“”]/g, '"').replace(/&/g, " and ")
      .replace(/\bl\.\s?a\.?(?=[\s,.!?]|$)/g, "la").replace(/\bl a(?= county\b)/g, "la")

    var i = 0;
    while (i < ws.length && FILLER.test(ws[i])) i += 1;
    var a = ws[i], b = ws[i + 1], n = 0;

    else if (a === "good" && ["morning", "afternoon", "evening", "day"].indexOf(b) >= 0) n = 2;
    /* "How are you?", "How's it going?", "How you doing?" are hellos too (version 8, Robert's 2nd try, Nov 20, 3:51 PM) */

    else if (a === "how" && b === "you" && ws[i + 2] === "doing") n = 3;
    else if (a === "how's" && b === "it" && ws[i + 2] === "going") n = 3;
    else if ((a === "how's" || (a === "how" && b === "is")) && ["your", "everything"].indexOf(a === "how" ? ws[i + 2] : b) >= 0) n = a === "how" ? 3 : 2;
    else if ((a === "high" || a === "hay" || a === "hei") && GREET_TAIL.indexOf(b) >= 0) n = 1; /* how a phone sometimes spells "hi there" */
    if (!n) return 0;
    while (GREET_TAIL.indexOf(ws[i + n]) >= 0 || GREET1.indexOf(ws[i + n]) >= 0) n += 1; /* "hi there", "hey everyone", "hi good morning" */

  }

  /* the registered question: where it starts and ends in the line, and whether it names the county */
  function question(t, st) {
    var re = /\bregist(?:er|ered|ration)\b/g, cre = countyRe(st), m, best = null;
    while ((m = re.exec(t))) {
      var before = t.slice(0, m.index).trim(), last4 = before.split(" ").slice(-4).join(" ");
      if (STATEMENT.test(before) || /\b(?:have|has|need|needs|must|should|got|gotta) to be$|\bonly(?: [a-z']+){0,2}$/.test(last4)) continue; /* "you have to be registered", "only registered voters count" */

      if (cm && t.slice(end, end + cm.index).trim().split(" ").filter(Boolean).length <= 5 && t.slice(end, end + cm.index).indexOf("?") < 0) { county = true; end = end + cm.index + cm[0].length; }

  }

  /* lesson 2's part 2 (version 5, Robert, Nov 20, 12:21 AM; playbook rule 27a): it counts when the opener names the hours (longer,
     more, evening or weekend hours) after "for" or after a verb, whatever the grammar. "Signatures for longer library hours!" counts.

     hours on their own ("Longer library hours."). The words have to sit outside the registered question. */

  var VERB = /^(?:is|are|am|was|i'm|we're|it's|that's|this's|petition's|here's|what's|its|funds?|funding|keeps?|keeping|gives?|giving|adds?|extends?|expands?|means|would|will|brings?|pays|opens?|makes?|gets?|gathering|collecting|getting|asking|want|wants|need|needs|trying|pushing|proposes?|supports?|supporting|backs?|backing|wins?|winning|help|helps|helping|hear|hearing|sign|signing|imagine|see|fight|fighting|vote|voting|like|love|deliver|delivers|restore|restores|demand|demanding)$/;
  var AFTER = /^(?:is|are|was|it's|that's|this's|what's|means|would|will)$/; /* the topic first: "Longer library hours is what this petition is for." */
  function hoursFor(t, q, g) {
    var at = 0, ws = t.split(" ").map(function (w) { var o = { w: w, at: at }; at += w.length + 1; return o; }).filter(function (x) { return x.w && x.w !== "?"; });

    var re = new RegExp(HOURS_RE.source, "g"), m;
    while ((m = re.exec(t))) {
      var s = m.index, e = s + m[0].length, first = -1, last = -1, inside = q && s >= q.at && s < q.end;
      for (var k = 0; k < ws.length; k += 1) { if (first < 0 && ws[k].at + ws[k].w.length > s) first = k; if (ws[k].at < e) last = k; }
      if (first < 0) continue;
      if (!inside && /^(?:keep|keeps|keeping|extends?|extending|expands?|expanding|lengthens?|lengthening|increas(?:e|es|ed|ing)|boost(?:s|ing)?|raise|raises|raising|adds?|adding|stay|stays|staying)\b/.test(m[0])) return true; /* the verb is part of the match: "keep libraries open later", "increasing the number of hours" */

        if (ws[j].w === "for" && j >= first - 2) return true; /* "for longer library hours", even inside the registered question */

    var tm = TIME_RE.exec(t), timeAt = tm ? tm.index : -1;
    var tn = t.replace(/\bneighborhood librar(?:y|ies) act\b/g, "the measure"); /* the measure's name isn't what it's for */

      if (!w || w === "?") return;
      seen += 1;
      if (seen <= g || FILLER.test(w) || (q && here >= q.at)) return; /* only what comes before the question counts toward "runs past about 12 words" */
      explWords += 1;
    });
    var long = !!q && explWords > 18; /* runs past about 17 words before the question (version 8: the course's own opener now says it's collecting signatures for a ballot measure, 12 words), one word of grace for a recognizer's extra word. With no question it can't run long before it. */

    return {

      greet: g > 0, topic: topic, sentence: sentence, hours: sentence, topicOnly: topicOnly, long: long, explWords: explWords, untrue: untrue, untrueSaid: um, promise: promise,
      alt: [false, topicOnly, false, sorryFirst], /* the second "missed" lines: only the topic, and an apology first */
      /* missed in a way no missed line describes: it ran long or wasn't true (the untrue card says that), or a sorry after the question */
      vague: [false, topic && !topicOnly && (long || !!untrue), false, sorryWord && !sorryFirst],
      /* how a part was missed when its plain line wouldn't be true (playbook rule 22a): something the measure doesn't say, too much

  /* lesson 1's rule comes back with a passerby who isn't registered: thank her and let her go. Telling her she can

  var PUSH = /\bsign(?: it| this| that| here)?(?: right)? (?:any ?ways?|regardless|though|still)\b|\bstill sign\b|\b(?:go ahead and|just|you can|you could|can still|could still|should still|should|want to) sign\b|\bsign (?:here|right here|this|it|for me|real quick)\b|\bhere(?:'s| is) (?:the|my|a|your) (?:board|petition|pen|clipboard|sheet)\b|\btake (?:the|this|my|a) (?:pen|board|clipboard|petition)\b|\b(?:doesn't|doesnt|does not|don't|dont) matter\b|\b(?:don't|dont|do not) (?:have|need) to be registered\b|\bregistered or not\b/;
  var COURTESY = /\bthank|\bno problem\b|\bno worries\b|\bnot a problem\b|\bthat's (?:ok|okay|fine|all right|alright|cool)\b|\bok(?:ay)?\b|\ball good\b|\bno sweat\b|\bgot it\b|\ball right\b|\balright\b|\bhave a (?:good|great|nice|wonderful|lovely)\b|\bhave a good one\b|\btake care\b|\b(?:good)?bye\b|\bsee you\b/;

,"ph":0},{"kind":"cards","name":"How the county checks","secs":25,"coach":{"who":"coach","text":"The county checks each signer's voter record for four things.","clip":"bcb02eb8c08f","dur":3.24},"cards":[{"who":"coach","text":"1. Is this person registered to vote?","clip":"bddfbdee8456","dur":2.66},{"who":"coach","text":"2. Are they registered in this county?","clip":"6ec2bc9c6b3d","dur":2.71},{"who":"coach","text":"3. Are they registered at the address they wrote?","clip":"b1a2144d60c0","dur":3.07},{"who":"coach","text":"4. Does the signature look like theirs?","clip":"5eae70937173","dur":3.12}],"after":{"who":"coach","text":"With four yeses, the signature counts. With one no, it's thrown out. Only the county decides, so never promise anyone their signature will count.","clip":"3d1a34ed7efb","dur":10.51},"ph":0},{"kind":"sort","name":"Sort five lines","secs":92,"coach":{"who":"coach","text":"Let's play the county. Five people signed at Westside Market today. Decide which lines count.","clip":"26478221cfea","dur":5.95},"ask":"Will the county count this line?","buttons":["Counts","Thrown out"],"last":"Next: the three thrown out","cards":[{"face":"marisol","text":"Marisol Vega is registered to vote at her Culver City apartment. She wrote that address and signed.","right":0,"why":"It counts. She's registered at that address, and she wrote the line herself."},{"face":"dwayne","text":"Dwayne Carter loves the library and filled in the line neatly. He has never registered to vote.","right":1,"why":"It's thrown out. Not being registered is the top reason lines get thrown out."},{"face":"soojin","text":"Soo-jin Kim is registered at 412 Palm Avenue, Apartment 4. She left off the apartment number.","right":0,"why":"It counts. A missing apartment number is fine when the house number and street match."},{"face":"theo","text":"Theo Lewis moved to Westwood last month and wrote his new address. His voter record still has his old one.","right":1,"why":"It's thrown out, because his vo oken ask raises givers and a third of shoppers avoid it",[["Andreoni, Rao and Trachtman","https://econweb.ucsd.edu/~jandreon/WorkingPapers/AndreoniRaoTrachtman.pdf"]],"a charity study used here as an analogy"],["Direct requests, eye contact, smiling and a small first request",[["Hadi and colleagues, Voluntas, 2026","https://www.cambridge.org/core/journals/voluntas/article/state-of-the-art-and-future-research-directions-in-facetoface-fundraising-a-systematic-literature-review/F15A95B216CC7CD05E92E7C29A1F72CD"]],"a review of charity fundraising studies"],["Hourly benchmarks",[["Change Laws Now post","https://www.career.com/job/change-laws-now/petition-circulator/j202604120919356252670"],["Wilson v. The La Jolla Group","https://law.justia.com/cases/california/court-of-appeal/2021/d077134.html"],["NJ Libertarian Party","https://njlp.org/news-top/35-candidates/169-petitioning"],["Clean the Darn Air","https://www.cleanthedarnair.org/guide-to-signature-gathering-in-utah/"]]],["Greet warmly, make eye contact, walk toward people",[["Arizona's training guide","https://wickenburgaz.gov/DocumentCenter/View/11663/Petition-Circulation-Training-Guide-from-SOS"]]],["Stand in front of the table and invite people over",[["Public Citizen","https://www.citizen.org/article/tips-for-petitioning-in-your-community/"]]],["Fast stopper lines, and not blocking traffic",[["CFER tips for petitioners","https://cfer.org/campaign/petitioners.html"]]],["A voter question as the opener",[["a Reclaim Idaho volunteer's tactics","https://medium.com/cam-crow/individual-tactics-for-collecting-ballot-initiative-signatures-b2a628251f17"],["SF Examiner","https://www.sfexaminer.com/after-dealing-drugs-in-las-vegas-he-found-signature-gathering-more-lucrative/article_3f4e108c-ed94-5c47-8abe-ee9c8cf5fdff.html"]]],["What the petition is for has to be true",[["Elections Code 18600","https://california.public.law/codes/elections_code_section_18600"]]],["Registered voters of one county",[["Elections Code 100","https etting paid for this?' Which answer is straight?","opts":["I'm just here for the libraries.","Yes, I'm paid to gather signatures."],"quote":true,"right":1,"after":{"who":"coach","text":"B is right. You already said you're paid once, so say it again.","clip":"314b16e7e9e7","dur":3.91}},{"pic":{"who":"bob"},"ask":"'If I sign, am I voting for it?' Which answer is straight?","opts":["No. Signing only helps put it on the ballot. The voters decide.","Pretty much. Signing means you support it."],"quote":true,"right":0,"after":{"who":"coach","text":"A is right. A signature helps put the question on the ballot, and it isn't a vote.","clip":"48a794d13ca0","dur":5.21}},{"pic":{"who":"anika"},"ask":"'How much is the tax?' Which answer is straight?","opts":["Just a few cents. You won't notice it.","I don't know. The summary doesn't say. The full text is right here."],"quote":true,"right":1,"after":{"who":"coach","text":"B is right. Never guess. 'I don't know, but it's printed right here' is a whole answer, and you can ask your lead later.","clip":"46acc9b031fa","dur":8.11}},{"pic":{"who":"ines"},"ask":"'What do I get for signing?' Which answer is straight?","opts":["Nothing from me. I can't give anything for a signature.","You get a free pen if you sign."],"quote":true,"right":0,"after":{"who":"coach","text":"A is right. Giving anything of value for a signature is against the law, even something small.","clip":"8569c3b22682","dur":6.43}}],"ph":2},{"kind":"spot","name":"Catch the mistake","secs":44,"head":"Listen for the part that goes wrong.","coach":{"who":"coach","text":"Here's the new canvasser one last time. Listen for the part that goes wrong.","clip":"a682a6f113eb","dur":4.9},"who":"karim","by":"rico","stopped":true,"note":"Stage note, art only: Karim Nassar, 33, a rideshare driver between rides, car keys in his hand.","lines":[{"who":"karim","text":"Is this a tax thing?","clip":"bab27c60d991","dur":1.46},{"who":"rico","text":"Don't worry about that part. It's all about ke     if (k + 1 < st.say.length) return go(S.step, sub + 1);
    $("#coach").innerHTML = q(st.done.text);
    sayLine(st.done, r).then(function () { if (r !== RUN) return; $(".mic").style.display = "none"; $("#ft").innerHTML = foot(btn(nextLabel(), "go")); $("#go").onclick = nextStep; });
  };
  if ($("#mic")) { micState("idle"); $("#mic").onclick = function () { if (!SR) { typedOn(finish); return; } if (M.rec) { M.rec.stop(); return; } audio(); stopSound(); micState("on"); M.rec = listen({ onStart: function () { if (r === RUN) liveGo(); }, onWords: function (t) { if (r === RUN) liveWords(t); }, onDone: function (t) { M.rec = null; if (r === RUN) finish(t); }, onError: function (c) { M.rec = null; if (r === RUN) micState("idle", micErr(c)); } }); }; }
};
/* check four lines: tap the box that gets the line thrown out, or Good to go */
VIEW.lines = function (st) {
  var r = RUN + 0, k = S.sub, X = st.lines[k], last = k === st.lines.length - 1;
  top({});
  show((TEXTC && k === 0 && st.coach ? '<p class="coachw">' + q(st.coach.text) + '</p>' : "") + '<h1 class="lineh">Line ' + X.tag + (st.ask ? ': ' + q(st.ask.charAt(0).toLowerCase() + st.ask.slice(1)) : "") + '</h1><div id="pw" class="psheet">' + pet(X.fill, { tap: true, big: true, note: X.note, sheet: true }) + '</div>' +
    '<div class="fill"><div class="opts" id="opts"><button class="opt" id="okb"><span style="flex:1;text-align:center">' + q(st.ok) + '</span></button></div><div id="why"></div></div><div id="ft"></div>', "abcd"[k]);
  if (k === 0) sayLine(st.coach, r);
  var done = false, pick = function (key) {
    if (done) return; done = true; stopSound();
    var marks = {}; if (X.right !== "ok") marks[X.right] = "right"; if (key !== X.right && key !== "ok") marks[key] = "wrong";
    $("#pw").innerHTML = pet(X.fill, { big: true, note: X.note, marks: marks, sheet: true }); fitHw();
    $("#okb").classList.add(X.right === "ok" ? "right" : key === "ok" ? "wrong" : "faded"); $("#okb").disabled = true; $("#opts").classList.add("done");
    var c = $("#coach"); if (c) c.remove();

    $("#ft").innerHTML = foot(btn(last ? nextLabel() : labelTo(S.step, k + 1), "go")); $("#go").onclick = function () { last ? nextStep() : go(S.step, k + 1); };
  };
  $("#pw").onclick = function (e) { var b = e.target.closest ? e.target.closest("[data-box]") : null; if (b) pick(b.getAttribute("data-box")); };
  $("#okb").onclick = function () { pick("ok"); };
};
/* your line: the declaration. Two of three cost the whole sheet; tap both. */
VIEW.decl = function (st) {
  var r = RUN + 0, sel = [];
  top({});
  /* one header, the question, with the coach's words under it while they play (version 8: one header per screen) */
  show('<h1>' + q(st.ask) + '</h1><p class="sub coachsub" id="coach">' + q(st.coach.text) + '</p><div class="opts decls" id="opts">' +
    st.cards.map(function (c, i) { return '<button class="decl" data-i="' + i + '">' + declPic(["own", "blank", "other"][i]) + '<span>' + q(c) + '</span></button>'; }).join("") + '</div><div class="fill"><div id="why"></div></div><div id="ft"></div>', "");
  sayLine(st.coach, r);
  [].forEach.call(document.querySelectorAll(".decl"), function (b) {
    b.onclick = function () {
      var i = +b.getAttribute("data-i"); if (sel.length >= 2) return;
      if (sel.indexOf(i) >= 0) { sel.splice(sel.indexOf(i), 1); b.classList.remove("sel"); return; }
      sel.push(i); b.classList.add("sel");
      if (sel.length < 2) return;
      stopSound();
      [].forEach.call(document.querySelectorAll(".decl"), function (x, j) { x.classList.remove("sel"); x.classList.add(st.right.indexOf(j) >= 0 ? "right" : sel.indexOf(j) >= 0 ? "wrong" : "keep"); x.disabled = true; });
      var ok = st.right.every(function (x) { return sel.indexOf(x) >= 0; }); $("#opts").classList.add("done");
      $("#coach").remove();

};
/* the first-shift card: one page, sent when lesson 1 ends */
function vCard() {
  var C = DATA.card;
  $("#top").innerHTML = ""; $("#top").style.display = "none"; $("#tag").textContent = "Sig card"; /* the card has no lesson bar, so the rules get its room */
  $("#scr").innerHTML = '<span class="drive"><b>' + esc(ST.drive.name) + '</b><small>' + esc(ST.drive.measure) + ' · petition drive</small></span><h1 class="lg">' + q(C.title) + '</h1><ol class="rules">' + C.rules.map(function (x) { return '<li><b>' + q(x[0]) + '</b> ' + q(x[1]) + '</li>'; }).join("") + '</ol>';
  /* the card is one page: all eight rules show with no scrolling. The type is as large as fits, and what room is left goes between the rules. */
  var fit = function () {
    var r = $(".rules"); if (!r) return; var li = r.children, f = 18, i;
    for (i = 0; i < li.length; i += 1) li[i].style.marginBottom = "0";
    r.style.fontSize = f + "px";
    while (f > 10.5 && r.scrollHeight > r.clientHeight + 0.5) { f -= 0.25; r.style.fontSize = f + "px"; }
    var used = 0; for (i = 0; i < li.length; i += 1) used += li[i].getBoundingClientRect().height;
    var gap = Math.max(0, Math.min(16, Math.floor((r.clientHeight - used - 1) / (li.length - 1))));
    for (i = 0; i < li.length - 1; i += 1) li[i].style.marginBottom = gap + "px";
  };
  fit(); window.addEventListener("resize", fit); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
}

else if (qs.has("at")) { var at0 = qs.get("at").split("."); S.step = -1; go(Math.max(0, Math.min(L.steps.length - 1, (parseInt(at0[0], 10) || 1) - 1)), parseInt(at0[1], 10) || 0); }
else go(-1);

window.__sg = { S: S, go: go, L: L, LN: LN, time: function () { var now = performance.now(), ms = Object.assign({}, TM.ms); if (TM.at >= 0) ms[TM.at] = (ms[TM.at] || 0) + now - TM.t0; return ms; }, run: function () { return RUN; }, M: M };
